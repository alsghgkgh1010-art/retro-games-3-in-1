<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-in-1 학습 오락실 · 초등 고학년</title>
<style>
  :root{
    --bg:#0b0b12; --panel:#15152a; --line:#3a3a6a;
    --ink:#f2f2ff; --dim:#a8a8d0;
    --accent:#ffd23f; --accent2:#41e0a3; --danger:#ff5c7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(circle at 50% 0%, #1d1d3a 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:18px; line-height:1.6;
    display:flex; flex-direction:column; min-height:100%;
  }

  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:12px clamp(12px,3vw,32px);
    border-bottom:3px solid var(--line); background:rgba(0,0,0,.35);
  }
  .logo{font-size:clamp(20px,2.6vw,30px); font-weight:800; margin:0; white-space:nowrap}
  .logo .num{color:var(--accent)}
  .spacer{flex:1}
  .hud{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .chip{
    background:var(--panel); border:2px solid var(--line); border-radius:10px;
    padding:6px 14px; font-weight:700; font-size:clamp(16px,1.8vw,22px);
    min-height:44px; display:flex; align-items:center; gap:8px;
  }
  .chip b{font-variant-numeric:tabular-nums}
  .chip.score b{color:var(--accent)}
  .chip.ox b.ok{color:var(--accent2)}
  .chip.ox b.no{color:var(--danger)}
  button{
    font-family:inherit; font-size:clamp(16px,1.8vw,20px); font-weight:700;
    min-height:44px; padding:8px 18px; border-radius:12px; cursor:pointer;
    border:3px solid var(--line); background:var(--panel); color:var(--ink);
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  button:hover{background:#22224a; border-color:var(--accent)}
  button:active{transform:translateY(2px)}
  button:focus-visible{outline:4px solid var(--accent2); outline-offset:3px}
  .btn-ghost{background:transparent}

  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
       padding:clamp(12px,3vw,28px); width:100%;}

  #menu{width:100%; max-width:1100px; text-align:center}
  #menu h2{font-size:clamp(22px,3vw,34px); margin:0 0 6px}
  #menu .sub{color:var(--dim); margin:0 0 clamp(16px,3vw,32px); font-size:clamp(16px,1.8vw,20px)}
  .cards{display:grid; gap:clamp(14px,2.5vw,26px); grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
  .card{
    background:var(--panel); border:4px solid var(--line); border-radius:20px;
    padding:clamp(18px,2.5vw,28px); cursor:pointer; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    min-height:250px; justify-content:center;
    transition:transform .12s ease, border-color .15s ease, background .15s ease;
    font:inherit; color:inherit;
  }
  .card:hover{border-color:var(--accent); background:#1e1e3d; transform:translateY(-4px)}
  .card:focus-visible{outline:4px solid var(--accent2); outline-offset:4px}
  .card .icon{font-size:clamp(46px,6vw,68px); line-height:1}
  .card .title{font-size:clamp(20px,2.4vw,26px); font-weight:800}
  .card .subj{
    font-size:15px; font-weight:700; color:#0b0b12; background:var(--accent2);
    border-radius:999px; padding:2px 12px;
  }
  .card .desc{color:var(--dim); font-size:clamp(15px,1.6vw,17px)}
  .card .keys{margin-top:2px; font-size:15px; color:var(--accent2); font-weight:700}

  #stage{display:none; width:100%; max-width:1000px}
  #stage.on{display:block}
  .frame{
    border:6px solid var(--line); border-radius:18px; overflow:hidden;
    background:#000; box-shadow:0 0 0 4px #000, 0 18px 40px rgba(0,0,0,.6);
    aspect-ratio:4/3; width:100%;
  }
  canvas{display:block; width:100%; height:100%; background:var(--bg); touch-action:none}
  .helpbar{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
           margin-top:14px; color:var(--dim); font-size:clamp(15px,1.7vw,18px);}
  .key{background:var(--panel); border:2px solid var(--line); border-radius:8px;
       padding:2px 10px; font-weight:700; color:var(--ink);}

  /* 교사용 패널 */
  #teacher{
    display:none; margin-top:16px; padding:16px 20px; border-radius:14px;
    border:3px dashed var(--accent); background:#1a1630; text-align:left;
  }
  #teacher.on{display:block}
  #teacher h3{margin:0 0 6px; font-size:20px; color:var(--accent)}
  #teacher .meta{color:var(--dim); font-size:16px; margin:0 0 10px}
  #teacher ul{margin:0; padding-left:22px; columns:2; column-gap:28px}
  #teacher li{font-size:17px; margin-bottom:4px; break-inside:avoid}
  @media (max-width:700px){ #teacher ul{columns:1} }

  #err{display:none; margin-top:16px; padding:14px 18px; border-radius:12px;
       border:3px solid var(--danger); background:#2a1220; color:#ffd9e2;
       font-size:17px; white-space:pre-wrap; text-align:left;}
  #err.on{display:block}

  footer{text-align:center; color:var(--dim); font-size:15px;
         padding:10px; border-top:2px solid var(--line);}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
  @media (min-width:1600px){ body{font-size:20px} #stage{max-width:1200px} }
</style>
</head>
<body>

<header>
  <h1 class="logo"><span class="num">3</span>-in-<span class="num">1</span> 학습 오락실</h1>
  <div class="spacer"></div>
  <div class="hud" id="hud" hidden>
    <div class="chip score">점수 <b id="score">0</b></div>
    <div class="chip ox">O <b class="ok" id="okCnt">0</b> · X <b class="no" id="noCnt">0</b></div>
    <button id="btnTeacher" class="btn-ghost" type="button">🧑‍🏫 교사용</button>
    <button id="btnRestart" type="button">↻ 다시하기</button>
    <button id="btnMenu" class="btn-ghost" type="button">◀ 게임 선택</button>
  </div>
</header>

<main>
  <section id="menu">
    <h2>어떤 공부를 해볼까요?</h2>
    <p class="sub">게임을 하나 골라 주세요. 게임 중에 <span class="key">ESC</span> 를 누르면 이 화면으로 돌아옵니다.</p>
    <div class="cards" id="cards"></div>
  </section>

  <section id="stage" aria-live="polite">
    <div class="frame">
      <canvas id="screen" width="800" height="600" tabindex="0" aria-label="게임 화면"></canvas>
    </div>
    <div class="helpbar" id="helpbar"></div>
    <div id="teacher" role="region" aria-label="교사용 문제 정보"></div>
    <div id="err" role="alert"></div>
  </section>
</main>

<footer>수업용 학습 오락실 · 소리 없음 · 인터넷 연결 없이 동작 · 초등 4~6학년</footer>

<script>
/* ===== 게임 모듈 인라인 번들 (learn/*.js 를 그대로 포함) ===== */
const MODULES = {};
MODULES["./fraction-breakout.js"] = (function(){
// 분수 벽돌깨기 — 초등 5~6학년 분수 학습용 벽돌깨기
// 학습게임 공통 인터페이스 계약 v2 준수: default export 클래스 1개 + INFO named export
// 외부 라이브러리·CDN·웹폰트·이미지·소리 없음. 순수 Canvas 2D, 파일 하나로 자급자족.

const W = 800;          // 논리 가로 해상도(고정)
const H = 600;          // 논리 세로 해상도(고정)
const BG = '#0b0b12';   // 배경색(계약값)

// 시스템 폰트 스택(웹폰트 금지)
const FONT = 'system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif';

// ---- 화면 구역 ----
const HUD_H = 70;              // 상단 점수·목숨 띠
const Q_TOP = HUD_H;           // 문제 띠 시작
const Q_BOTTOM = 146;          // 문제 띠 끝
const WALL = 12;               // 벽 두께
const FIELD_TOP = Q_BOTTOM + WALL; // 놀이판 위쪽 경계(158)

// ---- 패들 ----
const PADDLE_W = 140;          // 초보 배려: 넉넉한 폭
const PADDLE_H = 16;
const PADDLE_Y = H - 46;
const PADDLE_SPEED = 640;      // px/초

// ---- 공 ----
const BALL_R = 9;
const SPEED_BASE = 205;        // 1스테이지 시작 속도(느긋하게)
const SPEED_STEP = 18;         // 스테이지당 상승폭
const SPEED_MAX = 380;         // 속도 상한
const MIN_VY_RATIO = 0.32;     // 수평 갇힘 방지
const MIN_VX_RATIO = 0.12;     // 수직 갇힘 방지

// ---- 벽돌 ----
const ROWS = 4;
const COLS = 6;
const BRICK_GAP = 8;
const BRICK_MARGIN_X = 24;
const BRICK_TOP = FIELD_TOP + 14;
const BRICK_H = 56;
const BRICK_W = (W - BRICK_MARGIN_X * 2 - BRICK_GAP * (COLS - 1)) / COLS;
// 줄마다 색이 다르지만, 정답/오답과는 아무 상관 없다(색으로 정답을 알 수 없게).
const ROW_FILL = ['#2f3a63', '#33406e', '#374679', '#3b4c85'];
const ROW_EDGE = ['#8fa4ff', '#98abff', '#a2b3ff', '#adbbff'];

const STAGE_GOAL = 5;          // 한 스테이지에서 맞혀야 하는 문제 수
const MIN_ALIVE = 8;           // 살아있는 벽돌이 이보다 적으면 다시 채운다

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ===== 분수 계산 도우미 (계산이 틀리면 안 되므로 정수 연산만 사용) =====

function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const t = a % b; a = b; b = t; }
  return a || 1;
}

// 값 객체 만들기: 항상 기약분수로 줄인다.
// 결과 형태 → {t:'int', v} 또는 {t:'frac', n, d}
function mkFrac(n, d) {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d);
  const nn = n / g, dd = d / g;
  if (dd === 1) return { t: 'int', v: nn };
  return { t: 'frac', n: nn, d: dd };
}

// 대분수 값 객체 (w는 자연수 부분, n/d는 기약 진분수)
function mkMixed(w, n, d) {
  if (n === 0) return { t: 'int', v: w };
  const g = gcd(n, d);
  return { t: 'mixed', w, n: n / g, d: d / g };
}

// 값의 크기(비교·중복 판정용)
function vnum(v) {
  if (v.t === 'int') return v.v;
  if (v.t === 'frac') return v.n / v.d;
  return v.w + v.n / v.d;
}

// 표기까지 구별하는 고유 키(3/4 와 6/8 은 다른 보기로 취급)
function vkey(v) {
  if (v.t === 'int') return 'i' + v.v;
  if (v.t === 'frac') return 'f' + v.n + '/' + v.d;
  return 'm' + v.w + '_' + v.n + '/' + v.d;
}

// 사람이 읽는 글자(교사용 INFO·피드백용)
function vtext(v) {
  if (v.t === 'int') return String(v.v);
  if (v.t === 'frac') return v.n + '/' + v.d;
  return v.w + ' ' + v.n + '/' + v.d;
}

// 줄이지 않은 그대로의 분수(오답 보기용). 자연수로 떨어지면 만들지 않는다.
function rawFrac(n, d) {
  if (d === 0) return null;
  if (n % d === 0) return { t: 'int', v: n / d };
  return { t: 'frac', n, d };
}

// ===== 문제 생성 =====
// 모든 문제는 아래 형태를 돌려준다.
// { tokens: 화면에 그릴 조각들, answer: 정답 값 객체, key, wrongSeeds: [오답 후보], meta: 검증용 원자료 }

// 1) 동분모 분수의 덧셈·뺄셈 (4학년 복습)
function makeSameDenom() {
  const d = randInt(3, 12);
  const plus = Math.random() < 0.5;
  let a, b;
  if (plus) {
    // 합이 1보다 작게 만들어 진분수 답이 나오게 한다
    a = randInt(1, d - 2);
    b = randInt(1, d - 1 - a);
  } else {
    a = randInt(2, d - 1);
    b = randInt(1, a - 1);
  }
  const sum = plus ? a + b : a - b;
  const answer = mkFrac(sum, d);
  const wrongSeeds = [];
  // 흔한 오개념: 분모끼리도 계산해 버리기
  wrongSeeds.push(rawFrac(sum, d + d));
  // 흔한 오개념: 덧셈과 뺄셈을 반대로 하기
  if (!plus) wrongSeeds.push(rawFrac(a + b, d));
  wrongSeeds.push(rawFrac(sum + 1, d));
  if (sum - 1 >= 1) wrongSeeds.push(rawFrac(sum - 1, d));
  return {
    tokens: [
      { t: 'frac', n: a, d },
      { t: 'text', s: plus ? '+' : '−' },
      { t: 'frac', n: b, d },
      { t: 'text', s: '= ?' },
    ],
    answer,
    key: vkey(answer),
    wrongSeeds,
    meta: { kind: 'same', a, b, d, plus },
  };
}

// 2) 이분모 분수의 덧셈·뺄셈 (5학년, 분모 12 이하)
function makeDiffDenom() {
  for (let tryCount = 0; tryCount < 200; tryCount++) {
    const d1 = randInt(2, 10);
    let d2 = randInt(2, 12);
    if (d1 === d2) continue;
    const a = randInt(1, d1 - 1);
    const b = randInt(1, d2 - 1);
    const plus = Math.random() < 0.5;
    const num = plus ? a * d2 + b * d1 : a * d2 - b * d1;
    const den = d1 * d2;
    if (den > 120) continue;
    if (plus && num >= den) continue;   // 답은 진분수로
    if (!plus && num <= 0) continue;    // 답은 0보다 크게
    const answer = mkFrac(num, den);
    const wrongSeeds = [
      // 흔한 오개념: 분자는 분자끼리, 분모는 분모끼리
      rawFrac(plus ? a + b : Math.abs(a - b), d1 + d2),
      rawFrac(plus ? a + b : Math.abs(a - b), Math.max(d1, d2)),
      rawFrac(num, den), // 통분만 하고 약분을 안 한 값
      rawFrac(plus ? num + 1 : num + 1, den),
    ];
    return {
      tokens: [
        { t: 'frac', n: a, d: d1 },
        { t: 'text', s: plus ? '+' : '−' },
        { t: 'frac', n: b, d: d2 },
        { t: 'text', s: '= ?' },
      ],
      answer,
      key: vkey(answer),
      wrongSeeds,
      meta: { kind: 'diff', a, d1, b, d2, plus },
    };
  }
  return makeSameDenom();
}

// 3) 분수의 크기 비교
function makeCompare() {
  for (let tryCount = 0; tryCount < 200; tryCount++) {
    const d1 = randInt(2, 12);
    const d2 = randInt(2, 12);
    const a = randInt(1, d1 - 1);
    const b = randInt(1, d2 - 1);
    if (gcd(a, d1) !== 1 || gcd(b, d2) !== 1) continue; // 보기는 기약분수로만
    const v1 = a * d2, v2 = b * d1;
    if (v1 === v2) continue;
    const f1 = { t: 'frac', n: a, d: d1 };
    const f2 = { t: 'frac', n: b, d: d2 };
    const bigger = Math.random() < 0.5;   // 더 큰 것 / 더 작은 것 번갈아 묻기
    let answer, other;
    if ((v1 > v2) === bigger) { answer = f1; other = f2; } else { answer = f2; other = f1; }
    return {
      tokens: [
        f1,
        { t: 'text', s: '과' },
        f2,
        { t: 'text', s: '중 더 ' + (bigger ? '큰' : '작은') + ' 것은?' },
      ],
      answer,
      key: vkey(answer),
      wrongSeeds: [other],
      meta: { kind: 'compare', a, d1, b, d2, bigger },
    };
  }
  return makeSameDenom();
}

// 4) 약분해서 기약분수로 나타내기
function makeReduce() {
  for (let tryCount = 0; tryCount < 200; tryCount++) {
    const d0 = randInt(2, 7);
    const n0 = randInt(1, d0 - 1);
    if (gcd(n0, d0) !== 1) continue;
    const m = randInt(2, 4);
    const n = n0 * m, d = d0 * m;
    if (d > 28) continue;
    const answer = mkFrac(n, d); // = n0/d0
    const wrongSeeds = [];
    // 절반만 약분한 값, 분자만 나눈 값 같은 그럴듯한 오답
    if (m === 4) wrongSeeds.push(rawFrac(n0 * 2, d0 * 2));
    wrongSeeds.push(rawFrac(n0, d0 + 1));
    wrongSeeds.push(rawFrac(n0 + 1, d0));
    wrongSeeds.push(rawFrac(n - m, d));
    return {
      tokens: [
        { t: 'frac', n, d },
        { t: 'text', s: '을(를) 기약분수로?' },
      ],
      answer,
      key: vkey(answer),
      wrongSeeds,
      meta: { kind: 'reduce', n, d },
    };
  }
  return makeSameDenom();
}

// 5) 가분수 → 대분수
function makeToMixed() {
  for (let tryCount = 0; tryCount < 200; tryCount++) {
    const d = randInt(2, 9);
    const w = randInt(1, 4);
    const r = randInt(1, d - 1);
    if (gcd(r, d) !== 1) continue;
    const n = w * d + r;
    const answer = mkMixed(w, r, d);
    const wrongSeeds = [
      { t: 'mixed', w: w + 1, n: r, d },
      w > 1 ? { t: 'mixed', w: w - 1, n: r, d } : { t: 'mixed', w: w + 2, n: r, d },
      { t: 'mixed', w: r, n: w, d },              // 자연수와 분자를 바꿔 쓴 오답
      { t: 'mixed', w, n: d - r, d },
    ];
    return {
      tokens: [
        { t: 'frac', n, d },
        { t: 'text', s: '을(를) 대분수로?' },
      ],
      answer,
      key: vkey(answer),
      wrongSeeds,
      meta: { kind: 'tomixed', n, d },
    };
  }
  return makeSameDenom();
}

// 6) 대분수 → 가분수
function makeToImproper() {
  for (let tryCount = 0; tryCount < 200; tryCount++) {
    const d = randInt(2, 9);
    const w = randInt(1, 4);
    const r = randInt(1, d - 1);
    if (gcd(r, d) !== 1) continue;
    const n = w * d + r;              // gcd(n,d)=gcd(r,d)=1 이므로 이미 기약
    const answer = { t: 'frac', n, d };
    const wrongSeeds = [
      rawFrac(w + r, d),              // 흔한 오개념: 자연수와 분자를 그냥 더하기
      rawFrac(w * d, d),
      rawFrac(n + d, d),
      rawFrac(n - 1, d),
    ];
    return {
      tokens: [
        { t: 'mixed', w, n: r, d },
        { t: 'text', s: '을(를) 가분수로?' },
      ],
      answer,
      key: vkey(answer),
      wrongSeeds,
      meta: { kind: 'toimproper', w, r, d },
    };
  }
  return makeSameDenom();
}

// 스테이지에 따라 문제 유형을 넓힌다(처음 30초는 누구나 성공하도록 쉬운 유형만).
function makeProblem(stage) {
  let makers;
  if (stage <= 1) makers = [makeSameDenom, makeSameDenom, makeReduce];
  else if (stage === 2) makers = [makeSameDenom, makeReduce, makeCompare, makeToMixed];
  else makers = [makeSameDenom, makeDiffDenom, makeCompare, makeReduce, makeToMixed, makeToImproper];
  return pick(makers)();
}

// 정답 말고 화면을 채울 보기(오답)를 만든다.
function fillerValue(answer) {
  if (answer.t === 'mixed') {
    const d = randInt(2, 9);
    const n = randInt(1, d - 1);
    return { t: 'mixed', w: randInt(1, 5), n, d };
  }
  const d = randInt(2, 12);
  const n = randInt(1, d - 1);
  return { t: 'frac', n, d };
}

// 보기 목록 만들기: 정답 correctCount개 + 나머지는 오답. 섞어서 돌려준다.
// 약분 문제만 "값은 같지만 기약이 아닌" 보기를 허용한다(그게 바로 배울 점이라서).
function buildOptions(problem, total, correctCount) {
  const allowSameValue = problem.meta.kind === 'reduce';
  const ansNum = vnum(problem.answer);
  const used = new Set([problem.key]);
  const wrongs = [];

  const tryAdd = (v) => {
    if (!v) return;
    if (v.t === 'int' && v.v <= 0) return;
    if (v.t === 'frac' && (v.n <= 0 || v.d <= 1)) return;
    if (v.t === 'mixed' && (v.n <= 0 || v.d <= 1 || v.w <= 0)) return;
    const k = vkey(v);
    if (used.has(k)) return;
    if (!allowSameValue && Math.abs(vnum(v) - ansNum) < 1e-9) return;
    used.add(k);
    wrongs.push(v);
  };

  (problem.wrongSeeds || []).forEach(tryAdd);
  let guard = 0;
  while (wrongs.length < total - correctCount && guard < 2000) {
    tryAdd(fillerValue(problem.answer));
    guard++;
  }

  const options = [];
  for (let i = 0; i < correctCount; i++) options.push(problem.answer);
  for (let i = 0; i < total - correctCount; i++) {
    options.push(wrongs[i % Math.max(1, wrongs.length)] || fillerValue(problem.answer));
  }
  // 섞기(피셔-예이츠)
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = options[i]; options[i] = options[j]; options[j] = t;
  }
  return options;
}

// ===== 게임 본체 =====

class FractionBreakout {
  constructor(canvas) {
    this.canvas = canvas;
    canvas.width = W;
    canvas.height = H;
    this.ctx = canvas.getContext('2d');

    // 셸이 넣어 주는 훅(없어도 정상 동작)
    this.onScore = null;
    this.onGameOver = null;
    this.onStats = null;

    // 리스너·루프는 고정 참조로 보관(익명 함수 금지)
    this._onKeyDown = this._onKeyDown.bind(this);
    this._onKeyUp = this._onKeyUp.bind(this);
    this._loop = this._loop.bind(this);

    this._rafId = 0;
    this._running = false;
    this._listening = false;
    this._lastTs = 0;
    this._needFresh = false;

    this.keys = { left: false, right: false };
    this._resetGame();
  }

  // ===== 생명주기 =====

  start() {
    if (this._running) return;              // 중복 호출 안전
    this._running = true;
    if (!this._listening) {
      window.addEventListener('keydown', this._onKeyDown);
      window.addEventListener('keyup', this._onKeyUp);
      this._listening = true;
    }
    if (this.state === 'over' || this._needFresh) this._resetGame();
    this._needFresh = false;
    this._lastTs = 0;
    this._rafId = requestAnimationFrame(this._loop);
  }

  stop() {
    if (!this._running && !this._listening) return;  // 중복 호출 안전
    this._running = false;
    if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = 0; }
    if (this._listening) {
      window.removeEventListener('keydown', this._onKeyDown);
      window.removeEventListener('keyup', this._onKeyUp);
      this._listening = false;
    }
    this.keys.left = false;
    this.keys.right = false;
    this._needFresh = true;   // 다음 start()는 새 판
  }

  // ===== 상태 =====

  _resetGame() {
    this.score = 0;
    this.lives = 3;
    this.stage = 1;
    this.correct = 0;
    this.wrong = 0;
    this.solved = 0;              // 이번 스테이지에서 맞힌 문제 수
    this.state = 'ready';         // ready | playing | paused | stageclear | over
    this.stageTimer = 0;
    this.flash = 0;               // 목숨을 잃었을 때 붉은 표시
    this.feedback = null;         // {ok, val, timer}
    this._needFresh = false;
    this.paddle = { x: (W - PADDLE_W) / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
    this._buildBricks();
    this._newProblem(true);
    this._resetBall();
    this._emitScore();
    this._emitStats();
  }

  _buildBricks() {
    this.bricks = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        this.bricks.push({
          x: BRICK_MARGIN_X + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          row: r,
          alive: true,
          val: null,
          correct: false,
        });
      }
    }
  }

  // 새 문제를 내고, 살아있는 벽돌에 보기를 다시 적는다.
  _newProblem(first) {
    let next = makeProblem(this.stage);
    // 같은 문제가 연속으로 나오지 않게 한 번 더 뽑는다
    if (!first && this.problem) {
      for (let i = 0; i < 8 && next.key === this.problem.key && vtext(next.answer) === vtext(this.problem.answer); i++) {
        next = makeProblem(this.stage);
      }
    }
    this.problem = next;
    this._labelBricks();
  }

  _labelBricks() {
    let alive = this.bricks.filter((b) => b.alive);
    if (alive.length < MIN_ALIVE) {            // 벽돌이 너무 줄면 다시 채운다
      this.bricks.forEach((b) => { b.alive = true; });
      alive = this.bricks.slice();
    }
    // 정답 벽돌은 1~2개. 시작 스테이지는 넉넉하게 2개.
    let correctCount = this.stage <= 1 ? 2 : (Math.random() < 0.5 ? 1 : 2);
    correctCount = clamp(correctCount, 1, alive.length);
    const options = buildOptions(this.problem, alive.length, correctCount);
    for (let i = 0; i < alive.length; i++) {
      alive[i].val = options[i];
      alive[i].correct = vkey(options[i]) === this.problem.key;
    }
  }

  _resetBall() {
    this.speed = Math.min(SPEED_BASE + (this.stage - 1) * SPEED_STEP, SPEED_MAX);
    this.ball = {
      x: this.paddle.x + this.paddle.w / 2,
      y: this.paddle.y - BALL_R - 1,
      vx: 0, vy: 0, stuck: true,
    };
  }

  _launch() {
    if (!this.ball.stuck) return;
    const angle = (-Math.PI / 2) + (Math.random() * 0.5 - 0.25); // 위쪽으로 살짝 비스듬히
    this.ball.vx = Math.cos(angle) * this.speed;
    this.ball.vy = Math.sin(angle) * this.speed;
    this.ball.stuck = false;
    this.state = 'playing';
    this._enforceAngle();
  }

  _emitScore() { if (typeof this.onScore === 'function') this.onScore(this.score); }
  _emitStats() { if (typeof this.onStats === 'function') this.onStats({ correct: this.correct, wrong: this.wrong }); }

  _addScore(n) {
    this.score = Math.max(0, this.score + n);
    this._emitScore();
  }

  // ===== 입력 =====

  _onKeyDown(e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ' || k === 'Spacebar') {
      e.preventDefault(); // 화살표·스페이스로 화면이 스크롤되지 않게
    }
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') this.keys.left = true;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') this.keys.right = true;

    if (k === ' ' || k === 'Spacebar') {
      if (this.state === 'ready' || this.state === 'playing') this._launch();
    }
    if (k === 'p' || k === 'P') {
      if (this.state === 'playing' || this.state === 'ready') this.state = 'paused';
      else if (this.state === 'paused') this.state = this.ball.stuck ? 'ready' : 'playing';
    }
    if (k === 'r' || k === 'R') this._resetGame();
    // ESC는 셸 전용이라 쓰지 않는다.
  }

  _onKeyUp(e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') this.keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') this.keys.right = false;
  }

  // ===== 루프 =====

  _loop(ts) {
    if (!this._running) return;
    if (!this._lastTs) this._lastTs = ts;
    const dt = clamp((ts - this._lastTs) / 1000, 0, 0.05); // 탭 전환 시 dt 폭주 방지
    this._lastTs = ts;
    this._update(dt);
    this._draw();
    this._rafId = requestAnimationFrame(this._loop);
  }

  _update(dt) {
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt);
    if (this.feedback) {
      this.feedback.timer -= dt;
      if (this.feedback.timer <= 0) this.feedback = null;
    }
    if (this.state === 'paused' || this.state === 'over') return;

    this._movePaddle(dt);

    if (this.state === 'stageclear') {
      this.stageTimer -= dt;
      if (this.stageTimer <= 0) {
        this.stage += 1;
        this.solved = 0;
        this.bricks.forEach((b) => { b.alive = true; });
        this._newProblem(false);
        this._resetBall();
        this.state = 'ready';
      }
      return;
    }

    if (this.ball.stuck) {   // 발사 전에는 막대를 따라다닌다
      this.ball.x = this.paddle.x + this.paddle.w / 2;
      this.ball.y = this.paddle.y - BALL_R - 1;
      return;
    }
    this._moveBall(dt);
  }

  _movePaddle(dt) {
    const p = this.paddle;
    if (this.keys.left) p.x -= PADDLE_SPEED * dt;
    if (this.keys.right) p.x += PADDLE_SPEED * dt;
    p.x = clamp(p.x, WALL, W - WALL - p.w);
  }

  // 빠른 공이 벽돌을 통과하지 않도록 잘게 나눠 이동
  _moveBall(dt) {
    const b = this.ball;
    const dist = Math.hypot(b.vx, b.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.8)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;
      this._collideWalls();
      if (this.state !== 'playing') return;
      this._collideBricks();
      this._collidePaddle();
      if (this.state !== 'playing') return;
    }
  }

  _collideWalls() {
    const b = this.ball;
    if (b.x - BALL_R < WALL) { b.x = WALL + BALL_R; b.vx = Math.abs(b.vx); this._enforceAngle(); }
    if (b.x + BALL_R > W - WALL) { b.x = W - WALL - BALL_R; b.vx = -Math.abs(b.vx); this._enforceAngle(); }
    if (b.y - BALL_R < FIELD_TOP) { b.y = FIELD_TOP + BALL_R; b.vy = Math.abs(b.vy); this._enforceAngle(); }
    if (b.y - BALL_R > H) this._loseLife();   // 바닥으로 놓쳤을 때만 목숨이 준다
  }

  _collidePaddle() {
    const b = this.ball;
    const p = this.paddle;
    if (b.vy <= 0) return;
    if (b.y + BALL_R < p.y || b.y - BALL_R > p.y + p.h) return;
    if (b.x + BALL_R < p.x || b.x - BALL_R > p.x + p.w) return;
    const hit = clamp((b.x - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
    const maxAngle = (62 * Math.PI) / 180;
    const angle = hit * maxAngle;
    const sp = Math.min(Math.hypot(b.vx, b.vy), SPEED_MAX);
    b.vx = Math.sin(angle) * sp;
    b.vy = -Math.cos(angle) * sp;
    b.y = p.y - BALL_R - 0.5;
    this._enforceAngle();
  }

  _collideBricks() {
    const b = this.ball;
    for (let i = 0; i < this.bricks.length; i++) {
      const k = this.bricks[i];
      if (!k.alive) continue;
      if (b.x + BALL_R < k.x || b.x - BALL_R > k.x + k.w) continue;
      if (b.y + BALL_R < k.y || b.y - BALL_R > k.y + k.h) continue;

      // 겹침이 작은 축으로 되튄다
      const overlapX = Math.min(b.x + BALL_R - k.x, k.x + k.w - (b.x - BALL_R));
      const overlapY = Math.min(b.y + BALL_R - k.y, k.y + k.h - (b.y - BALL_R));
      if (overlapX < overlapY) { b.vx = -b.vx; b.x += b.vx > 0 ? overlapX : -overlapX; }
      else { b.vy = -b.vy; b.y += b.vy > 0 ? overlapY : -overlapY; }
      this._enforceAngle();

      k.alive = false;
      if (k.correct) this._onCorrect();
      else this._onWrong();
      return; // 한 번에 벽돌 하나만 처리
    }
  }

  _onCorrect() {
    this.correct += 1;
    this.solved += 1;
    this._addScore(100);
    this._emitStats();
    this.feedback = { ok: true, val: this.problem.answer, timer: 1.2 };
    if (this.solved >= STAGE_GOAL) {
      this.state = 'stageclear';
      this.stageTimer = 1.8;
      return;
    }
    this._newProblem(false);   // 다음 문제로 교체(벽돌 보기도 새로 적힘)
  }

  _onWrong() {
    this.wrong += 1;
    this._addScore(-20);       // 감점은 소폭. 게임오버는 절대 아니다.
    this._emitStats();
    this.feedback = { ok: false, val: this.problem.answer, timer: 2.0 };
    // 정답 벽돌이 남아 있는지 확인하고, 없으면 보기를 다시 적어 준다.
    const stillThere = this.bricks.some((x) => x.alive && x.correct);
    if (!stillThere) this._labelBricks();
  }

  // 각도 하한: 수평·수직 무한 반사 방지 + 속도 상한 유지
  _enforceAngle() {
    const b = this.ball;
    let sp = Math.hypot(b.vx, b.vy);
    if (sp === 0) return;
    if (sp > SPEED_MAX) sp = SPEED_MAX;
    let vx = b.vx, vy = b.vy;
    const minVy = sp * MIN_VY_RATIO;
    const minVx = sp * MIN_VX_RATIO;
    if (Math.abs(vy) < minVy) {
      vy = (vy < 0 ? -1 : 1) * minVy;
      vx = (vx < 0 ? -1 : 1) * Math.sqrt(Math.max(0, sp * sp - vy * vy));
    }
    if (Math.abs(vx) < minVx) {
      const sign = vx === 0 ? (Math.random() < 0.5 ? -1 : 1) : (vx < 0 ? -1 : 1);
      vx = sign * minVx;
      vy = (vy < 0 ? -1 : 1) * Math.sqrt(Math.max(0, sp * sp - vx * vx));
    }
    const cur = Math.hypot(vx, vy) || 1;
    b.vx = (vx / cur) * sp;
    b.vy = (vy / cur) * sp;
  }

  _loseLife() {
    this.lives -= 1;
    this.flash = 0.6;
    if (this.lives <= 0) {
      this.lives = 0;
      this.state = 'over';
      if (typeof this.onGameOver === 'function') this.onGameOver(this.score);
      return;
    }
    this._resetBall();
    this.state = 'ready';
  }

  // ===== 분수 그리기 =====

  // 값 하나의 가로 폭을 잰다
  _valWidth(val, size) {
    const ctx = this.ctx;
    const fs = Math.round(size * 0.85);
    if (val.t === 'int') {
      ctx.font = '700 ' + size + 'px ' + FONT;
      return ctx.measureText(String(val.v)).width;
    }
    if (val.t === 'frac') {
      ctx.font = '700 ' + fs + 'px ' + FONT;
      const wn = ctx.measureText(String(val.n)).width;
      const wd = ctx.measureText(String(val.d)).width;
      return Math.max(wn, wd) + 14;
    }
    ctx.font = '700 ' + size + 'px ' + FONT;
    const ww = ctx.measureText(String(val.w)).width;
    return ww + 8 + this._valWidth({ t: 'frac', n: val.n, d: val.d }, size);
  }

  // 왼쪽 x, 세로 가운데 cy 기준으로 그리고 그린 폭을 돌려준다
  _drawValAt(val, x, cy, size, color) {
    const ctx = this.ctx;
    const fs = Math.round(size * 0.85);
    ctx.fillStyle = color;
    ctx.textBaseline = 'middle';
    if (val.t === 'int') {
      ctx.font = '700 ' + size + 'px ' + FONT;
      ctx.textAlign = 'left';
      ctx.fillText(String(val.v), x, cy);
      return ctx.measureText(String(val.v)).width;
    }
    if (val.t === 'frac') {
      const w = this._valWidth(val, size);
      ctx.font = '700 ' + fs + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillText(String(val.n), x + w / 2, cy - fs * 0.64);   // 분자
      ctx.fillText(String(val.d), x + w / 2, cy + fs * 0.66);   // 분모
      ctx.strokeStyle = color;                                   // 가로줄
      ctx.lineWidth = Math.max(2, Math.round(size / 12));
      ctx.beginPath();
      ctx.moveTo(x + 3, cy);
      ctx.lineTo(x + w - 3, cy);
      ctx.stroke();
      return w;
    }
    // 대분수: 자연수 + 분수
    ctx.font = '700 ' + size + 'px ' + FONT;
    ctx.textAlign = 'left';
    ctx.fillText(String(val.w), x, cy);
    const ww = ctx.measureText(String(val.w)).width;
    const fw = this._drawValAt({ t: 'frac', n: val.n, d: val.d }, x + ww + 8, cy, size, color);
    return ww + 8 + fw;
  }

  // 문제 줄(글자 조각 + 분수 조각)을 가운데 정렬해서 그린다
  _drawTokens(tokens, cy, size, color) {
    const ctx = this.ctx;
    const gap = 12;
    let total = 0;
    const widths = tokens.map((tk) => {
      let w;
      if (tk.t === 'text') { ctx.font = '700 ' + size + 'px ' + FONT; w = ctx.measureText(tk.s).width; }
      else w = this._valWidth(tk, size);
      total += w;
      return w;
    });
    total += gap * (tokens.length - 1);
    let x = (W - total) / 2;
    for (let i = 0; i < tokens.length; i++) {
      const tk = tokens[i];
      if (tk.t === 'text') {
        ctx.fillStyle = color;
        ctx.font = '700 ' + size + 'px ' + FONT;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(tk.s, x, cy);
      } else {
        this._drawValAt(tk, x, cy, size, color);
      }
      x += widths[i] + gap;
    }
  }

  // ===== 화면 =====

  _draw() {
    const ctx = this.ctx;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);   // 매 프레임 배경 새로 칠하기
    this._drawField();
    this._drawBricks();
    this._drawPaddle();
    this._drawBall();
    this._drawHUD();
    this._drawQuestion();
    this._drawFeedback();
    this._drawOverlay();
  }

  _drawField() {
    const ctx = this.ctx;
    ctx.fillStyle = '#1d2033';
    ctx.fillRect(0, FIELD_TOP - WALL, W, WALL);
    ctx.fillRect(0, FIELD_TOP - WALL, WALL, H - FIELD_TOP + WALL);
    ctx.fillRect(W - WALL, FIELD_TOP - WALL, WALL, H - FIELD_TOP + WALL);
  }

  _drawBricks() {
    const ctx = this.ctx;

      ctx.fillText('← → 이동  ·  P 잠깐 멈춤  ·  R 다시 하기', W / 2, H / 2 + 40);
      return;
    }
    if (this.state === 'paused') {
      this._panel(H / 2 - 55, 110);
      ctx.fillStyle = '#ffd166';
      ctx.font = '700 40px ' + FONT;
      ctx.fillText('잠깐 멈춤', W / 2, H / 2 - 12);

    }
  }

    if (this._raf !== null) {
      cancelAnimationFrame(this._raf);
      this._raf = null;

    window.removeEventListener('keyup', this._onKeyUp);

      lanes[j] = t;
    }

    // 낙하 속도: 시간이 지날수록 조금씩 빨라진다 (시작 30초는 아주 느리게)
    const speed = 26 + Math.min(26, this.elapsed * 0.5) + Math.min(10, this.round * 0.5);

    const tiles = [];
    for (let i = 0; i < n; i++) {
      const [en, ko] = picks[i];
      const tw = ctx.measureText(en).width;
      const w = clamp(tw + 34, 108, laneW - 14);
      const h = 52;
      const cx = lanes[i] * laneW + laneW / 2;
      tiles.push({
        en,
        ko,
        isAnswer: en === answerEn,
        w,
        h,
        x: clamp(cx - w / 2, 8, W - 8 - w),
        y: PLAY_TOP - 70 - i * 46 - randInt(40),  // 시작 높이를 어긋나게
        vy: speed * (0.9 + Math.random() * 0.2),
        alive: true,
        mark: '',                                  // 'O' 또는 'X'
      });

  // ── 입력 ───────────────────────────────────────────────────

  _onKeyDown(e) {
    const c = e.code;
    if (c === 'ArrowLeft' || c === 'ArrowRight' || c === 'ArrowUp' ||
        c === 'ArrowDown' || c === 'Space') {
      e.preventDefault();
    }
    if (e.repeat) return;

    if (c === 'KeyP') {
      if (!this.gameOver) this.paused = !this.paused;
      return;
    }
    if (c === 'KeyR') {
      this._reset();
      return;
    }
    this.keys.add(c);
  }

  _onKeyUp(e) {
    this.keys.delete(e.code);
  }

  /** 창 포커스가 빠지면 눌린 키를 모두 놓은 것으로 처리 */
  _onBlur() {
    this.keys.clear();
  }

  _left() { return this.keys.has('ArrowLeft') || this.keys.has('KeyA'); }
  _right() { return this.keys.has('ArrowRight') || this.keys.has('KeyD'); }
  _firing() { return this.keys.has('Space'); }

  _tick(now) {

    if (!this._lastTime) this._lastTime = now;
    let dt = (now - this._lastTime) / 1000;
    this._lastTime = now;
    if (dt > 0.05) dt = 0.05;  // 탭 전환 등으로 인한 큰 점프 방지

    if (this.flash > 0) this.flash -= dt;

    this._updatePlayer(dt);

      this.revealTimer -= dt;

  _updateBullets(dt) {

      if (b.y + b.h < PLAY_TOP - 90) { this.bullets.splice(i, 1); continue; }

        this.wrong += 1;
        this.revealPicked = struck;

        this._emitStats();
        this._beginReveal('wrong');
      }
      return;
    }

    this.bullets.length = 0;

    if (!this._overNotified) {
      this._overNotified = true;
      if (typeof this.onGameOver === 'function') this.onGameOver(this.score);
    }
  }

  _emitScore() {
    if (typeof this.onScore === 'function') this.onScore(this.score);
  }

  _emitStats() {

  }

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    this._drawHud(ctx);
    this._drawQuestion(ctx);

    }

    // 바닥선
    ctx.fillStyle = '#39406b';
    ctx.fillRect(0, FLOOR_Y, W, 3);

    ctx.fillStyle = '#ffffff';
    for (const b of this.bullets) ctx.fillRect(b.x, b.y, b.w, b.h);

    this._drawPlayer(ctx);
    this._drawHint(ctx);

    if (this.phase === 'reveal' && !this.gameOver) this._drawReveal(ctx);
    if (this.gameOver) this._drawGameOver(ctx);
    else if (this.paused) this._drawPaused(ctx);
  }

  _drawStars(ctx) {
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    for (const s of this.stars) ctx.fillRect(s.x, s.y, s.r, s.r);
  }

  _drawHud(ctx) {
    ctx.textBaseline = 'top';
    ctx.font = 'bold 22px ' + KO_FONT;

    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('점수 ' + String(this.score).padStart(4, '0'), 20, 14);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#9fe8ff';
    ctx.fillText('O ' + this.correct + '   X ' + this.wrong, W / 2, 14);

    // 목숨: 숫자와 하트 기호를 함께 (색만으로 구분하지 않기)
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffffff';
    let hearts = '';
    for (let i = 0; i < this.lives; i++) hearts += '♥';
    ctx.fillText('목숨 ' + this.lives + ' ' + hearts, W - 20, 14);

    ctx.textBaseline = 'alphabetic';
  }

  /** 화면 위쪽의 큰 문제 (한글 뜻) */
  _drawQuestion(ctx) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 문제 띠
    ctx.fillStyle = this.flash > 0 && Math.floor(this.flash * 12) % 2 === 0
      ? 'rgba(108,240,194,0.22)'
      : 'rgba(255,255,255,0.07)';
    ctx.fillRect(60, 46, W - 120, 58);
    ctx.strokeStyle = '#6a74c8';
    ctx.lineWidth = 2;
    ctx.strokeRect(60, 46, W - 120, 58);

    ctx.font = 'bold 20px ' + KO_FONT;
    ctx.fillStyle = '#b9c0ff';
    ctx.fillText('주제 ' + this.question.topic, W / 2, 118);

    ctx.font = 'bold 34px ' + KO_FONT;
    ctx.fillStyle = '#ffe14d';
    ctx.fillText('문제:  ' + this.question.ko, W / 2, 76);

    ctx.textBaseline = 'alphabetic';
  }

  /** 내려오는 영어 낱말 한 칸 */
  _drawTile(ctx, t) {
    const isMarked = t.mark !== '';

    ctx.fillStyle = '#1b2140';
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.lineWidth = isMarked ? 4 : 2;
    ctx.strokeStyle = t.mark === 'O' ? '#6cf0c2' : (t.mark === 'X' ? '#ff8a8a' : '#8f97d8');
    ctx.strokeRect(t.x, t.y, t.w, t.h);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 26px ' + KO_FONT;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(t.en, t.x + t.w / 2, t.y + t.h / 2 + 1);

    // O/X 기호를 칸 위에 함께 표시 (색만으로 구분하지 않기)
    if (isMarked) {
      ctx.font = 'bold 30px ' + KO_FONT;
      ctx.fillStyle = t.mark === 'O' ? '#6cf0c2' : '#ff8a8a';
      ctx.fillText(t.mark, t.x + t.w / 2, t.y - 18);
    }

    ctx.textBaseline = 'alphabetic';
  }

  _drawPlayer(ctx) {
    const p = this.player;
    ctx.fillStyle = '#6cf0c2';
    ctx.fillRect(p.x, p.y + p.h * 0.55, p.w, p.h * 0.45);
    ctx.fillRect(p.x + p.w * 0.2, p.y + p.h * 0.25, p.w * 0.6, p.h * 0.35);
    ctx.fillRect(p.x + p.w * 0.44, p.y, p.w * 0.12, p.h * 0.35);
  }

  _drawHint(ctx) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px ' + KO_FONT;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('← → 이동   스페이스 발사   P 일시정지   R 다시하기', W / 2, H - 14);
  }

  /** 정답/오답 알림 + 정답 낱말과 뜻 공개 */
  _drawReveal(ctx) {
    const q = this.question;
    ctx.fillStyle = 'rgba(5,5,12,0.72)';
    ctx.fillRect(0, 208, W, 172);
    ctx.strokeStyle = this.revealKind === 'correct' ? '#6cf0c2' : '#ff8a8a';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 208, W, 172);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = 'bold 38px ' + KO_FONT;
    if (this.revealKind === 'correct') {
      ctx.fillStyle = '#6cf0c2';
      ctx.fillText('O  정답!', W / 2, 250);
    } else if (this.revealKind === 'wrong') {
      ctx.fillStyle = '#ff8a8a';
      const picked = this.revealPicked ? this.revealPicked.en : '';
      ctx.fillText('X  ' + picked + ' 은(는) 아니에요', W / 2, 250);
    } else {
      ctx.fillStyle = '#ff8a8a';
      ctx.fillText('X  놓쳤어요! 목숨 -1', W / 2, 250);
    }

    ctx.font = 'bold 40px ' + KO_FONT;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(q.en + '  =  ' + q.ko, W / 2, 308);

    ctx.font = 'bold 22px ' + KO_FONT;
    ctx.fillStyle = '#ffe14d';
    ctx.fillText('소리 내어 한 번 읽어 보세요', W / 2, 352);

    ctx.textBaseline = 'alphabetic';
  }

  _drawPaused(ctx) {
    ctx.fillStyle = 'rgba(5,5,12,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px ' + KO_FONT;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('일시정지', W / 2, H / 2 - 10);
    ctx.font = 'bold 24px ' + KO_FONT;
    ctx.fillStyle = '#ffe14d';
    ctx.fillText('P키를 다시 누르면 계속합니다', W / 2, H / 2 + 40);
  }

  _drawGameOver(ctx) {
    ctx.fillStyle = 'rgba(5,5,12,0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 54px ' + KO_FONT;
    ctx.fillStyle = '#ff7a7a';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 74);
    ctx.font = 'bold 32px ' + KO_FONT;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('점수 ' + this.score, W / 2, H / 2 - 20);
    ctx.font = 'bold 28px ' + KO_FONT;
    ctx.fillStyle = '#9fe8ff';
    ctx.fillText('맞힌 낱말 ' + this.correct + '개   틀린 낱말 ' + this.wrong + '개', W / 2, H / 2 + 24);
    ctx.font = 'bold 26px ' + KO_FONT;
    ctx.fillStyle = '#ffe14d';
    ctx.fillText('R키를 눌러 다시하기', W / 2, H / 2 + 74);
  }
}

return { default: WordShooter, INFO: (typeof INFO !== 'undefined' ? INFO : null) };

// ── 화면 상수 ───────────────────────────────────────

 * - 정답은 반드시 코드로 계산한다(사람이 적은 값을 쓰지 않는다).
 * - wrongs 는 "흔한 실수 값" 후보이며, 뒤에서 정답과 중복되지 않도록 다시 걸러진다.

function makeProblem(easyOnly) {
  const kinds = easyOnly

    : ['곱셈구구', '곱셈', '나눗셈', '혼합계산', '큰수덧셈', '큰수뺄셈', '괄호식'];

  }

  // 2) (두 자리) × (한 자리)

    };
  }

  // 4) 세 수의 혼합 계산 — 곱셈·나눗셈을 먼저 하는 규칙 익히기
  if (kind === '혼합계산') {
    const form = randInt(1, 3);
    if (form === 1) {
      // a + b × c
      const b = randInt(2, 9);
      const c = randInt(2, 9);
      const a = randInt(2, 30);
      const ans = a + b * c;
      // 흔한 실수: 앞에서부터 순서대로 계산 → (a + b) × c
      return {
        kind, text: a + ' + ' + b + ' × ' + c + ' = ?', answer: ans,
        wrongs: [(a + b) * c, a + b + c, ans + c, ans - c, ans + b]
      };
    }
    if (form === 2) {
      // a × b + c
      const a = randInt(2, 12);
      const b = randInt(2, 9);
      const c = randInt(2, 40);
      const ans = a * b + c;
      // 흔한 실수: 뒤쪽 덧셈을 먼저 → a × (b + c)
      return {
        kind, text: a + ' × ' + b + ' + ' + c + ' = ?', answer: ans,
        wrongs: [a * (b + c), a + b + c, ans + a, ans - a, ans + b]
      };
    }
    // a - b × c (결과가 0 이상이 되도록 a 를 정한다)
    const b = randInt(2, 9);
    const c = randInt(2, 9);
    const bc = b * c;
    const a = bc + randInt(1, 40);
    const ans = a - bc;
    // 흔한 실수: 앞에서부터 계산 → (a - b) × c
    return {
      kind, text: a + ' - ' + b + ' × ' + c + ' = ?', answer: ans,
      wrongs: [(a - b) * c, a - b - c, a - b + c, ans + c, ans - c]
    };
  }

  // 5) 큰 수의 덧셈 (세 자리 이내)
  if (kind === '큰수덧셈') {
    const a = randInt(105, 480);
    const b = randInt(105, 480);
    const ans = a + b;
    return {
      kind, text: a + ' + ' + b + ' = ?', answer: ans,
      // 흔한 실수: 받아올림을 빠뜨려 10 또는 100이 모자람
      wrongs: [ans - 10, ans - 100, ans + 10, ans + 1, ans - 1]
    };
  }

  // 6) 큰 수의 뺄셈 (결과가 음수가 되지 않게)
  if (kind === '큰수뺄셈') {
    const a = randInt(220, 980);
    const b = randInt(105, a - 20);
    const ans = a - b;
    return {
      kind, text: a + ' - ' + b + ' = ?', answer: ans,
      // 흔한 실수: 받아내림을 빠뜨림
      wrongs: [ans + 10, ans + 100, ans - 10, ans + 1, ans - 1]
    };
  }

  // 7) 괄호가 있는 식 — 괄호 먼저 계산하기
  {
    const c = randInt(2, 9);
    if (Math.random() < 0.5) {
      // (a - b) × c
      const diff = randInt(2, 9);
      const b = randInt(2, 20);
      const a = b + diff;
      const ans = diff * c;
      // 흔한 실수: 괄호를 무시하고 a - (b × c)
      const slip = a - b * c;
      return {
        kind, text: '(' + a + ' - ' + b + ') × ' + c + ' = ?', answer: ans,
        wrongs: [slip, a - b + c, ans + c, ans - c, ans + diff]
      };
    }
    // (a + b) × c
    const a = randInt(2, 12);
    const b = randInt(2, 12);
    const ans = (a + b) * c;
    // 흔한 실수: 괄호를 무시하고 a + (b × c)
    return {
      kind, text: '(' + a + ' + ' + b + ') × ' + c + ' = ?', answer: ans,
      wrongs: [a + b * c, a + b + c, ans + c, ans - c, ans - a]
    };
  }
}

/**
 * 문제 하나에 대해 보기 4개(정답 1 + 오답 3)를 만든다.
 * 규칙: 오답에 정답과 같은 값이 절대 들어가지 않고, 오답끼리도 중복되지 않는다.
 * @returns {{text:string, answer:number, kind:string, choices:number[]}}
 */
function makeQuestion(easyOnly) {
  const p = makeProblem(easyOnly);
  const ans = p.answer;
  const used = new Set([ans]);
  const wrongs = [];

  // (1) 흔한 실수 값을 먼저 채운다 — 교육적으로 의미 있는 오답
  for (const v of shuffle(p.wrongs.slice())) {
    if (wrongs.length >= 3) break;
    if (!usable(v) || used.has(v)) continue;
    used.add(v);
    wrongs.push(v);
  }

  // (2) 모자라면 정답 근처의 값으로 채운다
  let guard = 0;
  while (wrongs.length < 3 && guard < 300) {
    guard++;
    const delta = randInt(1, 12) * (Math.random() < 0.5 ? -1 : 1);
    const v = ans + delta;
    if (!usable(v) || used.has(v)) continue;
    used.add(v);
    wrongs.push(v);
  }

  // (3) 그래도 모자라면 0부터 훑어서 채운다(정답이 0 근처일 때의 안전장치)
  for (let v = 0; v <= 999 && wrongs.length < 3; v++) {
    if (used.has(v)) continue;
    used.add(v);
    wrongs.push(v);
  }

  return {
    text: p.text,
    answer: ans,
    kind: p.kind,
    choices: shuffle([ans].concat(wrongs))
  };
}

// ── 게임 클래스 ─────────────────────────────────────
class MathSnake {
  constructor(canvas) {
    this.canvas = canvas;
    this.canvas.width = W;
    this.canvas.height = H;
    this.ctx = canvas.getContext('2d');

    // 루프/리스너 관련 필드 (여기서 시작하지 않는다)
    this._rafId = 0;
    this._running = false;
    this._lastTime = 0;
    this._acc = 0;

    // 리스너는 바인딩된 참조를 필드에 보관해서 stop()에서 정확히 제거
    this._onKeyDown = this._onKeyDown.bind(this);
    this._frame = this._frame.bind(this);

    // 셸 연동 훅(없어도 정상 동작)
    this.onScore = null;
    this.onGameOver = null;
    this.onStats = null;

    this.best = 0;
    this.score = 0;
    this.correct = 0;
    this.wrong = 0;
    this._reset();
  }

  // ── 상태 초기화 ──────────────────────────────────
  /** 새 판 준비 */
  _reset() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    this.snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy }
    ];
    this.dir = { x: 1, y: 0 };   // 현재 진행 방향
    this.queue = [];             // 입력 큐(연속 입력이 꼬이지 않게)

    this.score = 0;
    this.correct = 0;
    this.wrong = 0;
    this.tickMs = TICK_START;
    this.paused = false;
    this.gameOver = false;
    this.started = false;        // 첫 방향키 입력 전에는 대기
    this._acc = 0;
    this._blink = 0;

    this.feedback = null;        // { ok:boolean, msg:string, left:number }
    this.question = null;
    this.lastText = '';
    this.foods = [];

    this.best = loadBest();
    this._nextQuestion();

    this.onScore?.(this.score);
    this.onStats?.({ correct: this.correct, wrong: this.wrong });
  }

  /** 새 문제를 뽑고 먹이 4개를 격자에 배치 */
  _nextQuestion() {
    const easyOnly = this.correct < 3;   // 시작 30초는 누구나 성공할 수 있게
    let q = makeQuestion(easyOnly);
    let guard = 0;
    // 같은 문제가 연속으로 나오지 않게
    while (q.text === this.lastText && guard < 20) { q = makeQuestion(easyOnly); guard++; }
    this.lastText = q.text;
    this.question = q;
    this._placeFoods(q.choices);
  }

  /** 값 목록을 서로 떨어진 빈 칸에 배치 */
  _placeFoods(values) {
    const occupied = new Set(this.snake.map(s => s.y * COLS + s.x));
    const head = this.snake[0];
    const spots = [];

    let guard = 0;
    while (spots.length < values.length && guard < 3000) {
      guard++;
      const x = randInt(0, COLS - 1);
      const y = randInt(0, ROWS - 1);
      if (occupied.has(y * COLS + x)) continue;
      // 머리 바로 앞에 붙어서 실수로 먹히지 않게 3칸 이상 떨어뜨린다
      if (Math.abs(x - head.x) + Math.abs(y - head.y) < 4) continue;
      // 먹이끼리도 충분히 떨어뜨린다(숫자 글상자가 겹치지 않게)
      let ok = true;
      for (const s of spots) {
        if (Math.abs(s.x - x) < 3 && Math.abs(s.y - y) < 2) { ok = false; break; }
      }
      if (!ok) continue;
      spots.push({ x, y });
    }
    // 아주 드물게 자리를 못 찾으면 남은 빈 칸 아무 데나 채운다
    if (spots.length < values.length) {
      for (let y = 0; y < ROWS && spots.length < values.length; y++) {
        for (let x = 0; x < COLS && spots.length < values.length; x++) {
          if (occupied.has(y * COLS + x)) continue;
          if (spots.some(s => s.x === x && s.y === y)) continue;
          spots.push({ x, y });
        }
      }
    }

    this.foods = spots.map((s, i) => ({
      x: s.x, y: s.y,
      value: values[i],
      isAnswer: values[i] === this.question.answer
    }));
  }

  /** 오답 먹이 하나를 새 자리·새 값으로 다시 놓는다(문제는 그대로) */
  _respawnWrongFood(old) {
    const used = new Set(this.foods.map(f => f.value));
    used.add(this.question.answer);
    used.add(old.value);
    let value = null;
    for (let t = 0; t < 200; t++) {
      const v = this.question.answer + randInt(1, 15) * (Math.random() < 0.5 ? -1 : 1);
      if (usable(v) && !used.has(v)) { value = v; break; }
    }
    if (value === null) {
      for (let v = 0; v <= 999; v++) { if (!used.has(v)) { value = v; break; } }
    }

    const occupied = new Set(this.snake.map(s => s.y * COLS + s.x));
    let spot = null;
    const head = this.snake[0];
    for (let t = 0; t < 800; t++) {
      const x = randInt(0, COLS - 1);
      const y = randInt(0, ROWS - 1);
      if (occupied.has(y * COLS + x)) continue;
      if (Math.abs(x - head.x) + Math.abs(y - head.y) < 4) continue;
      let ok = true;
      for (const f of this.foods) {
        if (Math.abs(f.x - x) < 3 && Math.abs(f.y - y) < 2) { ok = false; break; }
      }
      if (!ok) continue;
      spot = { x, y };
      break;
    }
    if (!spot) return;   // 자리가 없으면 그냥 먹이 하나가 줄어든 채로 진행
    this.foods.push({ x: spot.x, y: spot.y, value, isAnswer: false });
  }

  // ── 생명주기 ─────────────────────────────────────
  /** 루프 시작 + 키 리스너 등록. 중복 호출 안전 */
  start() {
    if (this._running) return;
    this._running = true;
    this._reset();
    window.addEventListener('keydown', this._onKeyDown);
    this._lastTime = 0;
    this._rafId = window.requestAnimationFrame(this._frame);
  }

  /** 루프 정지 + 리스너 해제 + 타이머 정리. 중복 호출 안전 */
  stop() {
    if (this._rafId) {
      window.cancelAnimationFrame(this._rafId);
      this._rafId = 0;
    }
    if (this._running) {
      window.removeEventListener('keydown', this._onKeyDown);
    }
    this._running = false;
  }

  // ── 입력 ─────────────────────────────────────────
  _onKeyDown(e) {
    const k = e.key;
    const code = e.code;

    // 방향키·스페이스로 화면이 스크롤되지 않게 막는다
    if (
      code === 'ArrowUp' || code === 'ArrowDown' ||
      code === 'ArrowLeft' || code === 'ArrowRight' || code === 'Space'
    ) {
      e.preventDefault();
    }

    // R: 다시하기
    if (k === 'r' || k === 'R' || code === 'KeyR') {
      this._reset();
      return;
    }

    // P: 일시정지 (게임 오버 상태에서는 무시)
    if (k === 'p' || k === 'P' || code === 'KeyP') {
      if (!this.gameOver) this.paused = !this.paused;
      return;
    }

    if (this.gameOver) return;

    let nd = null;
    if (code === 'ArrowUp' || code === 'KeyW') nd = { x: 0, y: -1 };
    else if (code === 'ArrowDown' || code === 'KeyS') nd = { x: 0, y: 1 };
    else if (code === 'ArrowLeft' || code === 'KeyA') nd = { x: -1, y: 0 };
    else if (code === 'ArrowRight' || code === 'KeyD') nd = { x: 1, y: 0 };
    if (!nd) return;

    // 일시정지 중 방향키를 누르면 자연스럽게 이어서 진행
    if (this.paused) this.paused = false;

    // 아직 시작 전이면 첫 입력으로 출발
    if (!this.started) { this.started = true; this._acc = 0; }

    this._pushDir(nd);
  }

  /**
   * 입력 큐에 방향을 넣는다.
   * 큐의 마지막 방향(없으면 현재 방향)을 기준으로
   * 정반대·중복 방향은 버려서 자기 목에 박는 즉사를 막는다.
   */
  _pushDir(nd) {
    const last = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
    if (nd.x === -last.x && nd.y === -last.y) return; // 정반대 금지
    if (nd.x === last.x && nd.y === last.y) return;   // 같은 방향 중복 금지
    if (this.queue.length >= 3) return;               // 큐 과다 방지
    this.queue.push(nd);
  }

  // ── 루프 ─────────────────────────────────────────
  _frame(now) {
    if (!this._running) return;
    if (!this._lastTime) this._lastTime = now;
    let dt = now - this._lastTime;
    this._lastTime = now;
    if (dt > 250) dt = 250; // 탭 전환 등으로 멈췄다 돌아온 경우 보정

    this._blink += dt;

    if (this.feedback) {
      this.feedback.left -= dt;
      if (this.feedback.left <= 0) this.feedback = null;
    }

    if (this.started && !this.paused && !this.gameOver) {
      this._acc += dt;
      let guard = 0;
      while (this._acc >= this.tickMs && !this.gameOver && guard < 5) {
        this._acc -= this.tickMs;
        this._step();
        guard++;
      }
    }

    this._draw();
    this._rafId = window.requestAnimationFrame(this._frame);
  }

  /** 한 칸 이동 */
  _step() {
    // 큐에서 방향 하나 꺼내기
    if (this.queue.length) {
      const nd = this.queue.shift();
      if (!(nd.x === -this.dir.x && nd.y === -this.dir.y)) this.dir = nd;
    }

    const head = this.snake[0];
    const nx = head.x + this.dir.x;
    const ny = head.y + this.dir.y;

    // 벽 충돌 → 게임 오버
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { this._die(); return; }

    const idx = this.foods.findIndex(f => f.x === nx && f.y === ny);
    const eaten = idx >= 0 ? this.foods[idx] : null;
    const willGrow = !!eaten && eaten.isAnswer;

    // 자기 몸 충돌 → 게임 오버 (꼬리 끝은 이번 틱에 비워지므로 제외)
    const limit = willGrow ? this.snake.length : this.snake.length - 1;
    for (let i = 0; i < limit; i++) {
      if (this.snake[i].x === nx && this.snake[i].y === ny) { this._die(); return; }
    }

    this.snake.unshift({ x: nx, y: ny });
    if (!willGrow) this.snake.pop();

    if (!eaten) return;

    if (eaten.isAnswer) {
      // 정답: 몸 +1, 점수 +, 다음 문제로
      this.correct++;
      this.score += SCORE_RIGHT;
      this.tickMs = Math.max(TICK_MIN, this.tickMs - TICK_STEP);
      this.feedback = { ok: true, msg: '정답!  ' + this.question.text.replace(' = ?', ' = ' + this.question.answer), left: FEEDBACK_MS };
      if (this.score > this.best) { this.best = this.score; saveBest(this.best); }
      this.onScore?.(this.score);
      this.onStats?.({ correct: this.correct, wrong: this.wrong });
      this._nextQuestion();
    } else {
      // 오답: 게임오버가 아니다. 소폭 감점 + 정답 안내 + 몸 1칸만 줄임
      this.wrong++;
      this.score = Math.max(0, this.score - SCORE_WRONG);
      this.feedback = { ok: false, msg: '아쉬워요.  정답은 ' + this.question.answer + ' 이에요', left: FEEDBACK_MS };
      if (this.snake.length > MIN_LEN) this.snake.pop();
      this.foods.splice(idx, 1);
      this._respawnWrongFood(eaten);
      this.onScore?.(this.score);
      this.onStats?.({ correct: this.correct, wrong: this.wrong });
    }
  }

  /** 게임 오버 처리 */
  _die() {
    this.gameOver = true;
    this.feedback = null;
    if (this.score > this.best) { this.best = this.score; saveBest(this.best); }
    this.onGameOver?.(this.score);
  }

  // ── 그리기 ───────────────────────────────────────
  _draw() {
    const ctx = this.ctx;

    ctx.fillStyle = C_BG;
    ctx.fillRect(0, 0, W, H);

    this._drawGrid();
    this._drawFoods();
    this._drawSnake();
    this._drawWalls();
    this._drawBand();

    if (this.feedback && !this.gameOver) this._drawFeedback();

    if (!this.started && !this.gameOver) this._drawReady();
    else if (this.paused && !this.gameOver) this._drawPaused();
    else if (this.gameOver) this._drawGameOver();
  }

  /** 은은한 격자 선 — 위치 파악을 쉽게 */
  _drawGrid() {
    const ctx = this.ctx;
    ctx.strokeStyle = C_GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) {
      ctx.moveTo(x * CELL + 0.5, GY);
      ctx.lineTo(x * CELL + 0.5, H);
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.moveTo(0, GY + y * CELL + 0.5);
      ctx.lineTo(W, GY + y * CELL + 0.5);
    }
    ctx.stroke();
  }

  /** 격자 바깥 벽 */
  _drawWalls() {
    const ctx = this.ctx;
    ctx.strokeStyle = C_WALL;
    ctx.lineWidth = 4;
    ctx.strokeRect(2, GY + 2, W - 4, H - GY - 4);
  }

  /** 모서리가 둥근 사각형 경로 (roundRect 없는 브라우저 대비 직접 구현) */
  _roundRect(x, y, w, h, r) {
    const ctx = this.ctx;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  /** 숫자 먹이: 흰 알약 + 노란 테두리 + 큰 검은 숫자 (색이 아니라 숫자로 고른다) */
  _drawFoods() {
    const ctx = this.ctx;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 24px ' + FONT;

    for (const f of this.foods) {
      const cx = f.x * CELL + CELL / 2;
      const cy = GY + f.y * CELL + CELL / 2;
      const txt = String(f.value);
      const tw = ctx.measureText(txt).width;
      const bw = Math.max(CELL - 6, tw + 16);
      const bh = CELL - 8;

      ctx.fillStyle = C_FOOD;
      this._roundRect(cx - bw / 2, cy - bh / 2, bw, bh, 8);
      ctx.fill();
      ctx.strokeStyle = C_FOOD_EDGE;
      ctx.lineWidth = 3;
      this._roundRect(cx - bw / 2, cy - bh / 2, bw, bh, 8);
      ctx.stroke();

      ctx.fillStyle = C_FOOD_TEXT;
      ctx.fillText(txt, cx, cy + 1);
    }
    ctx.restore();
  }

  /** 지렁이: 몸은 사각형+테두리, 머리는 밝은 색 + 눈(진행 방향 표시) */
  _drawSnake() {
    const ctx = this.ctx;

    for (let i = this.snake.length - 1; i >= 1; i--) {
      const s = this.snake[i];
      const px = s.x * CELL;
      const py = GY + s.y * CELL;
      ctx.fillStyle = C_BODY;
      ctx.fillRect(px + 3, py + 3, CELL - 6, CELL - 6);
      ctx.strokeStyle = C_BODY_EDGE;
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 4.5, py + 4.5, CELL - 9, CELL - 9);
    }

    const h = this.snake[0];
    const hx = h.x * CELL;
    const hy = GY + h.y * CELL;
    ctx.fillStyle = C_HEAD;
    ctx.fillRect(hx + 2, hy + 2, CELL - 4, CELL - 4);
    ctx.strokeStyle = C_HEAD_EDGE;
    ctx.lineWidth = 3;
    ctx.strokeRect(hx + 3.5, hy + 3.5, CELL - 7, CELL - 7);

    // 눈 두 개 — 진행 방향 쪽으로 치우치게 그려서 방향이 보이게
    const cx = hx + CELL / 2;
    const cy = hy + CELL / 2;
    const d = this.dir;
    const fx = d.x * CELL * 0.22;
    const fy = d.y * CELL * 0.22;
    const sx = -d.y * CELL * 0.20;
    const sy = d.x * CELL * 0.20;

    ctx.fillStyle = C_HEAD_EDGE;
    for (const sign of [1, -1]) {
      ctx.beginPath();
      ctx.arc(cx + fx + sx * sign, cy + fy + sy * sign, 3.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /** 위쪽 문제 띠 */
  _drawBand() {
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = C_BAND;
    ctx.fillRect(0, 0, W, BAND);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, BAND - 1);
    ctx.lineTo(W, BAND - 1);
    ctx.stroke();

    ctx.textBaseline = 'middle';

    // 윗줄: 점수 / 정답·오답 / 최고
    ctx.font = 'bold 20px ' + FONT;
    ctx.textAlign = 'left';
    ctx.fillStyle = C_TEXT;
    ctx.fillText('점수 ' + this.score, 16, 24);

    ctx.textAlign = 'center';
    ctx.fillStyle = C_SUB;
    ctx.fillText('맞힘 O ' + this.correct + '   틀림 X ' + this.wrong, W / 2, 24);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd76b';
    ctx.fillText('최고 ' + this.best, W - 16, 24);

    // 아랫줄: 문제 (크고 굵게)
    ctx.textAlign = 'center';
    ctx.font = 'bold 46px ' + FONT;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(this.question ? this.question.text : '', W / 2, 76);

    ctx.font = 'bold 20px ' + FONT;
    ctx.fillStyle = C_SUB;
    ctx.fillText('정답 숫자를 먹으세요   ·   P 일시정지   ·   R 다시하기', W / 2, 106);
    ctx.restore();
  }

  /** 정답/오답 안내 띠 — 색과 함께 O / X 기호를 반드시 같이 보여준다 */
  _drawFeedback() {
    const ctx = this.ctx;
    const fb = this.feedback;
    const bh = 66;
    const by = GY + 10;
    ctx.save();
    ctx.globalAlpha = 0.94;
    ctx.fillStyle = fb.ok ? '#123a26' : '#3a1420';
    ctx.fillRect(40, by, W - 80, bh);
    ctx.strokeStyle = fb.ok ? C_OK : C_NO;
    ctx.lineWidth = 3;
    ctx.strokeRect(41.5, by + 1.5, W - 83, bh - 3);

    ctx.globalAlpha = 1;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.font = 'bold 40px ' + FONT;
    ctx.fillStyle = fb.ok ? C_OK : C_NO;
    ctx.fillText(fb.ok ? 'O' : 'X', 62, by + bh / 2);

    ctx.font = 'bold 26px ' + FONT;
    ctx.fillStyle = C_TEXT;
    ctx.fillText(fb.msg, 108, by + bh / 2 + 1);
    ctx.restore();
  }

  /** 가운데 안내 상자 */
  _drawPanel(lines, boxH) {
    const ctx = this.ctx;
    const bw = 660;
    const bx = (W - bw) / 2;
    const by = GY + (H - GY - boxH) / 2;
    ctx.save();
    ctx.fillStyle = 'rgba(8,8,16,0.92)';
    ctx.fillRect(bx, by, bw, boxH);
    ctx.strokeStyle = C_OK;
    ctx.lineWidth = 3;
    ctx.strokeRect(bx + 1.5, by + 1.5, bw - 3, boxH - 3);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let y = by + 44;
    for (const ln of lines) {
      ctx.font = 'bold ' + ln.size + 'px ' + FONT;
      ctx.fillStyle = ln.color;
      ctx.fillText(ln.text, W / 2, y);
      y += ln.size + 16;
    }
    ctx.restore();
  }

  /** 시작 전 안내 */
  _drawReady() {
    this._drawPanel([
      { text: '연산 지렁이', size: 42, color: '#9dff6b' },
      { text: '방향키로 지렁이를 움직이세요', size: 24, color: C_TEXT },
      { text: '위쪽 문제의 정답 숫자를 먹으면 몸이 길어져요', size: 22, color: C_SUB },
      { text: '벽과 자기 몸에 부딪히지 않게 조심하세요', size: 22, color: C_SUB },
      { text: '아무 방향키나 누르면 시작!', size: 26, color: '#ffd76b' }
    ], 300);
  }

  /** 일시정지 */
  _drawPaused() {
    this._drawPanel([
      { text: '잠깐 멈춤', size: 42, color: '#ffd76b' },
      { text: 'P키를 다시 누르면 이어서 합니다', size: 24, color: C_TEXT }
    ], 170);
  }

  /** 게임 오버 */
  _drawGameOver() {
    const isBest = this.score > 0 && this.score >= this.best;
    this._drawPanel([
      { text: '게임 끝!', size: 44, color: C_NO },
      { text: '점수 ' + this.score, size: 30, color: C_TEXT },
      { text: '맞힘 O ' + this.correct + '개   ·   틀림 X ' + this.wrong + '개', size: 24, color: C_SUB },
      { text: isBest ? '최고 기록을 세웠어요!' : '최고 기록 ' + this.best, size: 22, color: '#ffd76b' },
      { text: 'R키를 누르면 다시하기', size: 26, color: C_OK }
    ], 320);
  }

  // 자체 검증용(브라우저 동작과 무관) — 문제 생성기를 밖에서 확인할 때 쓴다
  static _makeQuestion(easyOnly) { return makeQuestion(easyOnly); }
}

// ── 교사용 정보 ─────────────────────────────────────
const INFO = {
  subject: '수학',
  grade: '4~6학년',
  goal: '곱셈·나눗셈과 혼합 계산에서 계산 순서를 지켜 답을 바르게 구할 수 있다.',
  minutes: 5,
  howto: '방향키로 지렁이를 움직여 위쪽 문제의 정답이 적힌 숫자 먹이를 먹으세요.',
  items: [
    '7 × 8 = 56',
    '9 × 6 = 54',
    '34 × 7 = 238',
    '48 × 5 = 240',
    '96 ÷ 8 = 12',
    '72 ÷ 9 = 8',
    '54 ÷ 6 = 9',
    '12 + 3 × 4 = 24',
    '7 × 6 + 15 = 57',
    '50 - 4 × 8 = 18',
    '(15 - 7) × 3 = 24',
    '(6 + 9) × 4 = 60',
    '286 + 457 = 743',
    '405 + 178 = 583',
    '724 - 356 = 368',
    '900 - 245 = 655'
  ]
};

return { default: MathSnake, INFO: (typeof INFO !== 'undefined' ? INFO : null) };
})();

/* =========================================================
   학습 오락실 (단일 파일 배포본 · 더블클릭 실행)
   계약 v2: constructor(canvas) / start() / stop()
   훅: onScore(score), onGameOver(score), onStats({correct,wrong})
   named export INFO 로 교사용 문제 정보 표시
   ※ file:// 더블클릭용은 인라인 배포본(학습-오락실.html) 사용
   ========================================================= */

const GAMES = [
  { id:'fraction', file:'./fraction-breakout.js', icon:'🧱', subj:'수학', title:'분수 벽돌깨기',
    desc:'문제의 답이 적힌 벽돌을 공으로 맞혀요.', keys:'← → 이동 · 스페이스 발사' },
  { id:'word',     file:'./word-shooter.js',      icon:'🔤', subj:'영어', title:'영단어 슈팅',
    desc:'뜻에 맞는 영어 단어를 찾아서 쏘세요.',   keys:'← → 이동 · 스페이스 발사' },
  { id:'math',     file:'./math-snake.js',        icon:'🐍', subj:'수학', title:'연산 지렁이',
    desc:'답이 적힌 먹이를 찾아 먹어요.',          keys:'← ↑ → ↓ 이동' },
];

const $ = (id) => document.getElementById(id);
const cardsEl=$('cards'), menuEl=$('menu'), stageEl=$('stage'), canvas=$('screen');
const hudEl=$('hud'), scoreEl=$('score'), okEl=$('okCnt'), noEl=$('noCnt');
const helpbarEl=$('helpbar'), teacherEl=$('teacher'), errEl=$('err');

let current=null, currentId=null, currentInfo=null;

for (const g of GAMES) {
  const btn=document.createElement('button');
  btn.className='card'; btn.type='button';
  btn.innerHTML =
    '<span class="icon" aria-hidden="true">'+g.icon+'</span>'+
    '<span class="subj">'+g.subj+'</span>'+
    '<span class="title">'+g.title+'</span>'+
    '<span class="desc">'+g.desc+'</span>'+
    '<span class="keys">'+g.keys+'</span>';
  btn.addEventListener('click',()=>launch(g));
  cardsEl.appendChild(btn);
}

async function launch(g){
  hideError();
  await shutdown();

  let Klass=null, INFO=null;
  try{
    const mod = MODULES[g.file];
    if (!mod) throw new Error("게임이 번들에 없습니다: " + g.file);
    Klass = mod.default; INFO = mod.INFO || null;
    if (typeof Klass !== 'function') throw new Error('default export 가 클래스가 아닙니다.');
  }catch(e){
    showStage(g);
    showError('"'+g.title+'" 을(를) 불러오지 못했습니다.\n\n'+e.message+'\n\n'+
      '새로고침(F5) 후에도 계속 나오면 파일이 손상된 것일 수 있습니다.');
    return;
  }

  showStage(g);
  currentInfo = INFO; renderTeacher();

  current = new Klass(canvas);
  currentId = g.id;
  resetHud();
  current.onScore    = (s)=>{ scoreEl.textContent = String(s ?? 0); };
  current.onGameOver = (s)=>{ scoreEl.textContent = String(s ?? 0); };
  current.onStats    = (st)=>{
    okEl.textContent = String((st && st.correct) || 0);
    noEl.textContent = String((st && st.wrong)   || 0);
  };
  current.start();
  canvas.focus();
}

function resetHud(){ scoreEl.textContent='0'; okEl.textContent='0'; noEl.textContent='0'; }

function showStage(g){
  menuEl.style.display='none';
  stageEl.classList.add('on');
  hudEl.hidden=false;
  helpbarEl.innerHTML =
    '<span class="key">'+g.keys.split(' · ').join('</span> <span class="key">')+'</span>'+
    '<span><span class="key">P</span> 일시정지</span>'+
    '<span><span class="key">R</span> 다시하기</span>'+
    '<span><span class="key">ESC</span> 게임 선택</span>';
}

function renderTeacher(){
  teacherEl.classList.remove('on');
  if(!currentInfo){ teacherEl.innerHTML='<p class="meta">이 게임은 교사용 정보를 제공하지 않습니다.</p>'; return; }
  const i=currentInfo;
  const items=Array.isArray(i.items)?i.items:[];
  teacherEl.innerHTML =
    '<h3>🧑‍🏫 교사용 · '+esc(i.goal||'')+'</h3>'+
    '<p class="meta">'+esc(i.subject||'')+' · '+esc(i.grade||'')+
      ' · 예상 '+esc(String(i.minutes||'-'))+'분<br>'+esc(i.howto||'')+'</p>'+
    (items.length ? '<ul>'+items.map(t=>'<li>'+esc(String(t))+'</li>').join('')+'</ul>' : '');
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function shutdown(){
  if(current){
    try{ current.stop(); }catch(e){ console.warn('stop() 중 오류:', e); }
    current.onScore=null; current.onGameOver=null; current.onStats=null;
  }
  current=null; currentId=null;
  const ctx=canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

async function toMenu(){
  await shutdown(); hideError();
  stageEl.classList.remove('on');
  teacherEl.classList.remove('on');
  hudEl.hidden=true; menuEl.style.display=''; resetHud();
}

$('btnMenu').addEventListener('click', toMenu);
$('btnRestart').addEventListener('click', ()=>{
  const g=GAMES.find(x=>x.id===currentId); if(g) launch(g);
});
$('btnTeacher').addEventListener('click', ()=>{
  teacherEl.classList.toggle('on');
  if(teacherEl.classList.contains('on')) teacherEl.scrollIntoView({block:'nearest'});
});

// ESC = 메뉴로 (게임은 ESC 를 쓰지 않기로 계약)
window.addEventListener('keydown',(e)=>{
  if(e.key==='Escape' && stageEl.classList.contains('on')){ e.preventDefault(); toMenu(); }
});
// 게임 중 방향키/스페이스로 페이지 스크롤 방지
window.addEventListener('keydown',(e)=>{
  if(!current) return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key)) e.preventDefault();
},{passive:false});

function showError(m){ errEl.textContent=m; errEl.classList.add('on'); }
function hideError(){ errEl.textContent=''; errEl.classList.remove('on'); }
</script>
