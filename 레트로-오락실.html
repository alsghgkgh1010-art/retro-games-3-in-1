<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-in-1 레트로 아케이드 오락실</title>
<style>
  :root{
    --bg:#0b0b12;
    --panel:#15152a;
    --line:#3a3a6a;
    --ink:#f2f2ff;
    --dim:#a8a8d0;
    --accent:#ffd23f;
    --accent2:#41e0a3;
    --danger:#ff5c7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(circle at 50% 0%, #1d1d3a 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:18px;
    line-height:1.6;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }

  /* ---------- 상단 바 ---------- */
  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:12px clamp(12px,3vw,32px);
    border-bottom:3px solid var(--line);
    background:rgba(0,0,0,.35);
  }
  .logo{
    font-size:clamp(20px,2.6vw,30px); font-weight:800; letter-spacing:.02em;
    margin:0; white-space:nowrap;
  }
  .logo .num{color:var(--accent)}
  .spacer{flex:1}
  .hud{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .chip{
    background:var(--panel); border:2px solid var(--line); border-radius:10px;
    padding:6px 14px; font-weight:700; font-size:clamp(16px,1.8vw,22px);
    min-height:44px; display:flex; align-items:center; gap:8px;
  }
  .chip b{color:var(--accent); font-variant-numeric:tabular-nums}
  button{
    font-family:inherit; font-size:clamp(16px,1.8vw,20px); font-weight:700;
    min-height:44px; padding:8px 18px; border-radius:12px; cursor:pointer;
    border:3px solid var(--line); background:var(--panel); color:var(--ink);
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  button:hover{background:#22224a; border-color:var(--accent)}
  button:active{transform:translateY(2px)}
  button:focus-visible{outline:4px solid var(--accent2); outline-offset:3px}
  .btn-ghost{background:transparent}

  /* ---------- 본문 ---------- */
  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
       padding:clamp(12px,3vw,28px); width:100%;}

  /* 게임 선택 화면 */
  #menu{width:100%; max-width:1100px; text-align:center}
  #menu h2{font-size:clamp(22px,3vw,34px); margin:0 0 6px}
  #menu .sub{color:var(--dim); margin:0 0 clamp(16px,3vw,32px); font-size:clamp(16px,1.8vw,20px)}
  .cards{
    display:grid; gap:clamp(14px,2.5vw,26px);
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  }
  .card{
    background:var(--panel); border:4px solid var(--line); border-radius:20px;
    padding:clamp(18px,2.5vw,28px); cursor:pointer; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    min-height:230px; justify-content:center;
    transition:transform .12s ease, border-color .15s ease, background .15s ease;
    font:inherit; color:inherit;
  }
  .card:hover{border-color:var(--accent); background:#1e1e3d; transform:translateY(-4px)}
  .card:focus-visible{outline:4px solid var(--accent2); outline-offset:4px}
  .card .icon{font-size:clamp(46px,6vw,68px); line-height:1}
  .card .title{font-size:clamp(20px,2.4vw,26px); font-weight:800}
  .card .desc{color:var(--dim); font-size:clamp(15px,1.6vw,17px)}
  .card .keys{margin-top:4px; font-size:15px; color:var(--accent2); font-weight:700}

  /* 게임 화면 */
  #stage{display:none; width:100%; max-width:1000px}
  #stage.on{display:block}
  .frame{
    border:6px solid var(--line); border-radius:18px; overflow:hidden;
    background:#000; box-shadow:0 0 0 4px #000, 0 18px 40px rgba(0,0,0,.6);
    aspect-ratio:4/3; width:100%;
  }
  canvas{display:block; width:100%; height:100%; background:var(--bg); touch-action:none}
  .helpbar{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    margin-top:14px; color:var(--dim); font-size:clamp(15px,1.7vw,18px);
  }
  .key{
    background:var(--panel); border:2px solid var(--line); border-radius:8px;
    padding:2px 10px; font-weight:700; color:var(--ink);
  }
  #err{
    display:none; margin-top:16px; padding:14px 18px; border-radius:12px;
    border:3px solid var(--danger); background:#2a1220; color:#ffd9e2;
    font-size:17px; white-space:pre-wrap; text-align:left;
  }
  #err.on{display:block}

  footer{
    text-align:center; color:var(--dim); font-size:15px;
    padding:10px; border-top:2px solid var(--line);
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important}
  }
  /* 대화면(교실 TV) 대응 */
  @media (min-width:1600px){
    body{font-size:20px}
    #stage{max-width:1200px}
  }
</style>
</head>
<body>

<header>
  <h1 class="logo"><span class="num">3</span>-in-<span class="num">1</span> 레트로 오락실</h1>
  <div class="spacer"></div>
  <div class="hud" id="hud" hidden>
    <div class="chip">점수 <b id="score">0</b></div>
    <button id="btnRestart" type="button">↻ 다시하기</button>
    <button id="btnMenu" class="btn-ghost" type="button">◀ 게임 선택</button>
  </div>
</header>

<main>
  <!-- 게임 선택 -->
  <section id="menu">
    <h2>어떤 게임을 할까요?</h2>
    <p class="sub">게임을 하나 골라 주세요. 게임 중에 <span class="key">ESC</span> 를 누르면 다시 이 화면으로 돌아옵니다.</p>
    <div class="cards" id="cards"></div>
  </section>

  <!-- 게임 화면 -->
  <section id="stage" aria-live="polite">
    <div class="frame">
      <canvas id="screen" width="800" height="600" tabindex="0" aria-label="게임 화면"></canvas>
    </div>
    <div class="helpbar" id="helpbar"></div>
    <div id="err" role="alert"></div>
  </section>
</main>

<footer>수업용 레트로 아케이드 · 소리 없음 · 인터넷 연결 없이 동작 · 파일 하나로 실행</footer>

<script>
/* ===== games/shooter.js (인라인) ===== */
const Shooter = (() => {
// 스페이스 인베이더 스타일 슈팅 게임
// 공통 인터페이스 계약(games/INTERFACE.md) v1 준수
// - default export 클래스 1개, constructor(canvas) / start() / stop()
// - 외부 라이브러리, CDN, 이미지, 소리 없음. 순수 Canvas 2D.

const W = 800;              // 논리 가로 해상도
const H = 600;              // 논리 세로 해상도
const BG = '#0b0b12';       // 배경색

// 적 격자: 8열 x 5행 (윗줄일수록 고득점)
const COLS = 8;
const ROWS = 5;
const CELL_W = 56;
const CELL_H = 42;
const E_W = 36;
const E_H = 24;
const GRID_TOP = 96;

// 적 종류: 색 + 모양을 둘 다 다르게 해서 색만으로 구분하지 않도록 함
const ENEMY_TYPES = [
  { kind: 'squid', color: '#ffe14d', score: 30 }, // 0행: 노랑 오징어형
  { kind: 'crab',  color: '#4dd2ff', score: 20 }, // 1행: 하늘색 게형
  { kind: 'crab',  color: '#4dd2ff', score: 20 }, // 2행
  { kind: 'ufo',   color: '#7cf06a', score: 10 }, // 3행: 초록 접시형
  { kind: 'ufo',   color: '#7cf06a', score: 10 }, // 4행
];

const PLAYER_Y = 538;
const PLAYER_W = 46;
const PLAYER_H = 22;
const PLAYER_SPEED = 330;   // px/초
const SHOT_COOLDOWN = 0.25; // 초 (누르고 있으면 자동 연사)
const MAX_PLAYER_BULLETS = 4;

const BARRIER_COUNT = 4;
const B_COLS = 7;
const B_ROWS = 4;
const B_BLOCK = 11;         // 방어벽 블록 한 칸 크기
const BARRIER_TOP = 452;

// 적이 반사되는 좌우 벽 여백
const WALL = 24;

/** 값을 min~max 사이로 자르기 */
function clamp(v, min, max) {
  return v < min ? min : (v > max ? max : v);
}

/** 두 사각형 충돌 판정 */
function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

class Shooter {
  constructor(canvas) {
    this.canvas = canvas;
    this.canvas.width = W;
    this.canvas.height = H;
    this.ctx = canvas.getContext('2d');

    // 루프/리스너 상태 (생성자에서는 절대 시작하지 않음)
    this._raf = null;
    this._running = false;
    this._lastTime = 0;

    // 리스너는 반드시 바인딩된 참조를 필드에 저장 (stop에서 정확히 해제)
    this._onKeyDown = this._onKeyDown.bind(this);
    this._onKeyUp = this._onKeyUp.bind(this);
    this._onBlur = this._onBlur.bind(this);
    this._tick = this._tick.bind(this);

    this.keys = new Set();
    this.score = 0;

    // 옵셔널 훅 (셸이 필요하면 대입해서 사용)
    this.onScore = null;
    this.onGameOver = null;

    this._reset();
  }

  // ── 공개 API ──────────────────────────────────────────────

  /** 루프 시작 + 키 리스너 등록. 중복 호출해도 안전. */
  start() {
    if (this._running) return;
    this._running = true;
    this._reset();
    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);
    window.addEventListener('blur', this._onBlur);
    this._lastTime = 0;
    this._raf = requestAnimationFrame(this._tick);
  }

  /** 루프 중지 + 리스너 전부 해제. 중복 호출해도 안전. */
  stop() {
    this._running = false;
    if (this._raf !== null) {
      cancelAnimationFrame(this._raf);
      this._raf = null;
    }
    window.removeEventListener('keydown', this._onKeyDown);
    window.removeEventListener('keyup', this._onKeyUp);
    window.removeEventListener('blur', this._onBlur);
    this.keys.clear();
  }

  // ── 상태 초기화 ───────────────────────────────────────────

  /** 새 판 시작 */
  _reset() {
    this.score = 0;
    this.lives = 3;
    this.wave = 1;
    this.paused = false;
    this.gameOver = false;
    this._overNotified = false;

    this.player = { x: W / 2 - PLAYER_W / 2, y: PLAYER_Y, w: PLAYER_W, h: PLAYER_H };
    this.bullets = [];
    this.enemyBullets = [];
    this.shotTimer = 0;
    this.invuln = 0;          // 피격 후 무적 시간(초)
    this.animTimer = 0;       // 적 애니메이션용 누적 시간
    this.bannerTimer = 1.6;   // 시작 전 "준비!" 배너
    this.bannerText = '준비!';

    this._makeStars();
    this._makeBarriers();
    this._makeWave();
    this._emitScore();
  }

  /** 배경 별 (장식용, 판마다 새로 뿌림) */
  _makeStars() {
    this.stars = [];
    for (let i = 0; i < 46; i++) {
      this.stars.push({
        x: Math.random() * W,
        y: Math.random() * (H - 120),
        r: Math.random() < 0.25 ? 2 : 1,
      });
    }
  }

  /** 방어벽 만들기 (블록별 내구도 2) */
  _makeBarriers() {
    this.barriers = [];
    const bw = B_COLS * B_BLOCK;
    const gap = (W - BARRIER_COUNT * bw) / (BARRIER_COUNT + 1);
    for (let i = 0; i < BARRIER_COUNT; i++) {
      const ox = gap + i * (bw + gap);
      const blocks = [];
      for (let r = 0; r < B_ROWS; r++) {
        for (let c = 0; c < B_COLS; c++) {
          // 아래 가운데를 비워 아치 모양으로
          if (r >= B_ROWS - 2 && c >= 2 && c <= B_COLS - 3) continue;
          blocks.push({
            x: ox + c * B_BLOCK,
            y: BARRIER_TOP + r * B_BLOCK,
            w: B_BLOCK,
            h: B_BLOCK,
            hp: 2,
          });
        }
      }
      this.barriers.push(blocks);
    }
  }

  /** 현재 웨이브의 적 격자 생성 */
  _makeWave() {
    const startX = (W - COLS * CELL_W) / 2 + (CELL_W - E_W) / 2;
    this.enemies = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = ENEMY_TYPES[r];
        this.enemies.push({
          x: startX + c * CELL_W,
          y: GRID_TOP + r * CELL_H,
          w: E_W,
          h: E_H,
          row: r,
          kind: t.kind,
          color: t.color,
          score: t.score,
          alive: true,
        });
      }
    }
    this.enemyTotal = this.enemies.length;
    this.dir = 1;
    // 웨이브가 오를수록 기본 속도 상승 (초반은 아주 느리게)
    this.baseSpeed = 26 + (this.wave - 1) * 9;
    this.dropStep = 16 + Math.min(8, this.wave);
    this.enemyBullets.length = 0;
    // 적 발사 간격: 웨이브가 오를수록 짧아짐
    this.fireBase = Math.max(0.45, 2.1 - (this.wave - 1) * 0.22);
    this.fireTimer = this.fireBase * 1.6; // 시작 직후엔 여유 있게
  }

  // ── 입력 ─────────────────────────────────────────────────

  _onKeyDown(e) {
    const c = e.code;
    if (c === 'ArrowLeft' || c === 'ArrowRight' || c === 'ArrowUp' ||
        c === 'ArrowDown' || c === 'Space') {
      e.preventDefault();
    }
    if (e.repeat) return;

    if (c === 'KeyP') {
      if (!this.gameOver) this.paused = !this.paused;
      return;
    }
    if (c === 'KeyR') {
      this._reset();
      return;
    }
    this.keys.add(c);
  }

  _onKeyUp(e) {
    this.keys.delete(e.code);
  }

  /** 창 포커스가 빠지면 눌린 키를 모두 놓은 것으로 처리 */
  _onBlur() {
    this.keys.clear();
  }

  _left() { return this.keys.has('ArrowLeft') || this.keys.has('KeyA'); }
  _right() { return this.keys.has('ArrowRight') || this.keys.has('KeyD'); }
  _firing() { return this.keys.has('Space'); }

  // ── 메인 루프 ────────────────────────────────────────────

  _tick(now) {
    if (!this._running) return;
    if (!this._lastTime) this._lastTime = now;
    let dt = (now - this._lastTime) / 1000;
    this._lastTime = now;
    if (dt > 0.05) dt = 0.05; // 탭 전환 등으로 인한 큰 점프 방지

    if (!this.paused && !this.gameOver) this._update(dt);
    this._draw();

    this._raf = requestAnimationFrame(this._tick);
  }

  _update(dt) {
    this.animTimer += dt;
    if (this.invuln > 0) this.invuln -= dt;
    if (this.shotTimer > 0) this.shotTimer -= dt;

    this._updatePlayer(dt);
    this._updateBullets(dt);

    if (this.bannerTimer > 0) {
      // 배너 동안엔 적이 멈춰 있어 학생이 준비할 시간을 준다
      this.bannerTimer -= dt;
      return;
    }

    this._updateEnemies(dt);
    this._updateEnemyFire(dt);
    this._checkWaveClear();
  }

  _updatePlayer(dt) {
    let vx = 0;
    if (this._left()) vx -= 1;
    if (this._right()) vx += 1;
    this.player.x = clamp(
      this.player.x + vx * PLAYER_SPEED * dt,
      16,
      W - 16 - this.player.w
    );

    if (this._firing() && this.shotTimer <= 0 && this.bullets.length < MAX_PLAYER_BULLETS) {
      this.bullets.push({
        x: this.player.x + this.player.w / 2 - 2.5,
        y: this.player.y - 12,
        w: 5,
        h: 14,
      });
      this.shotTimer = SHOT_COOLDOWN;
    }
  }

  _updateBullets(dt) {
    // 플레이어 총알: 위로
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.y -= 520 * dt;
      if (b.y + b.h < 0) { this.bullets.splice(i, 1); continue; }
      if (this._hitBarrier(b)) { this.bullets.splice(i, 1); continue; }
      let killed = false;
      for (const e of this.enemies) {
        if (!e.alive || !hit(b, e)) continue;
        e.alive = false;
        this.score += e.score;
        this._emitScore();
        killed = true;
        break;
      }
      if (killed) this.bullets.splice(i, 1);
    }

    // 적 총알: 아래로
    const evy = 165 + (this.wave - 1) * 18;
    for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
      const b = this.enemyBullets[i];
      b.y += evy * dt;
      if (b.y > H) { this.enemyBullets.splice(i, 1); continue; }
      if (this._hitBarrier(b)) { this.enemyBullets.splice(i, 1); continue; }
      if (this.invuln <= 0 && hit(b, this.player)) {
        this.enemyBullets.splice(i, 1);
        this._playerHit();
      }
    }
  }

  /** 방어벽 충돌 처리. 맞았으면 true */
  _hitBarrier(b) {
    for (const blocks of this.barriers) {
      for (let i = 0; i < blocks.length; i++) {
        if (hit(b, blocks[i])) {
          blocks[i].hp -= 1;
          if (blocks[i].hp <= 0) blocks.splice(i, 1);
          return true;
        }
      }
    }
    return false;
  }

  _updateEnemies(dt) {
    const alive = this.enemies.filter((e) => e.alive);
    if (alive.length === 0) return;

    // 남은 적이 적을수록 빨라진다 (고전 인베이더 느낌)
    const ratio = 1 - alive.length / this.enemyTotal;
    const speed = this.baseSpeed * (1 + ratio * 2.2);

    let minX = Infinity;
    let maxX = -Infinity;
    for (const e of alive) {
      e.x += this.dir * speed * dt;
      if (e.x < minX) minX = e.x;
      if (e.x + e.w > maxX) maxX = e.x + e.w;
    }

    // 벽에 닿으면 한 칸 내려오고 방향 전환 + 속도 소폭 증가
    if ((this.dir > 0 && maxX >= W - WALL) || (this.dir < 0 && minX <= WALL)) {
      this.dir *= -1;
      this.baseSpeed *= 1.05;
      for (const e of alive) {
        e.y += this.dropStep;
        e.x = clamp(e.x, WALL, W - WALL - e.w); // 벽에 박히지 않게 밀어넣기
      }
      for (const e of alive) {
        if (e.y + e.h >= this.player.y) {
          this._endGame();
          return;
        }
      }
    }
  }

  _updateEnemyFire(dt) {
    this.fireTimer -= dt;
    if (this.fireTimer > 0) return;
    this.fireTimer = this.fireBase * (0.6 + Math.random() * 0.9);

    // 각 열에서 가장 아래에 있는 적만 발사할 수 있다
    const shooters = new Map();
    for (const e of this.enemies) {
      if (!e.alive) continue;
      const key = Math.round(e.x / 4);
      const cur = shooters.get(key);
      if (!cur || e.y > cur.y) shooters.set(key, e);
    }
    const list = Array.from(shooters.values());
    if (list.length === 0) return;
    const s = list[Math.floor(Math.random() * list.length)];
    this.enemyBullets.push({ x: s.x + s.w / 2 - 3, y: s.y + s.h, w: 6, h: 16 });
  }

  _checkWaveClear() {
    if (this.enemies.some((e) => e.alive)) return;
    this.wave += 1;
    this.bullets.length = 0;
    this._makeWave();
    this.bannerText = '웨이브 ' + this.wave + ' 시작!';
    this.bannerTimer = 1.6;
  }

  _playerHit() {
    this.lives -= 1;
    this.invuln = 2.0;
    this.enemyBullets.length = 0;
    this.player.x = W / 2 - PLAYER_W / 2;
    if (this.lives <= 0) {
      this.lives = 0;
      this._endGame();
    }
  }

  _endGame() {
    if (this.gameOver) return;
    this.gameOver = true;
    if (!this._overNotified) {
      this._overNotified = true;
      if (typeof this.onGameOver === 'function') this.onGameOver(this.score);
    }
  }

  _emitScore() {
    if (typeof this.onScore === 'function') this.onScore(this.score);
  }

  // ── 그리기 ───────────────────────────────────────────────

  _draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    this._drawStars(ctx);
    this._drawHud(ctx);

    // 바닥선
    ctx.fillStyle = '#39406b';
    ctx.fillRect(0, H - 8, W, 3);

    for (const e of this.enemies) {
      if (e.alive) this._drawEnemy(ctx, e);
    }
    this._drawBarriers(ctx);
    this._drawPlayer(ctx);

    ctx.fillStyle = '#ffffff';
    for (const b of this.bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#ff8a5c';
    for (const b of this.enemyBullets) ctx.fillRect(b.x, b.y, b.w, b.h);

    if (this.gameOver) this._drawGameOver(ctx);
    else if (this.paused) this._drawPaused(ctx);
    else if (this.bannerTimer > 0) this._drawBanner(ctx);
  }

  _drawStars(ctx) {
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    for (const s of this.stars) ctx.fillRect(s.x, s.y, s.r, s.r);
  }

  _drawHud(ctx) {
    ctx.textBaseline = 'top';
    ctx.font = 'bold 24px system-ui, "Malgun Gothic", sans-serif';

    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('점수 ' + String(this.score).padStart(4, '0'), 20, 16);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe14d';
    ctx.fillText('웨이브 ' + this.wave, W / 2, 16);

    // 목숨: 숫자 + 아이콘 병행 (색만으로 구분하지 않기)
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('목숨 ' + this.lives, W - 20, 16);
    for (let i = 0; i < this.lives; i++) {
      this._shipShape(ctx, W - 42 - i * 30, 50, 24, 12, '#6cf0c2');
    }

    ctx.font = 'bold 20px system-ui, "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('← → 이동   스페이스 발사   P 일시정지   R 재시작', W / 2, H - 34);

    ctx.textBaseline = 'alphabetic';
  }

  /** 우주선 모양 (플레이어 + 목숨 아이콘 공용) */
  _shipShape(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y + h * 0.55, w, h * 0.45);                 // 몸체
    ctx.fillRect(x + w * 0.2, y + h * 0.25, w * 0.6, h * 0.35); // 어깨
    ctx.fillRect(x + w * 0.44, y, w * 0.12, h * 0.35);          // 포신
  }

  _drawPlayer(ctx) {
    // 무적 시간 동안 깜빡임
    if (this.invuln > 0 && Math.floor(this.invuln * 10) % 2 === 0) return;
    const p = this.player;
    this._shipShape(ctx, p.x, p.y, p.w, p.h, '#6cf0c2');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(p.x + p.w * 0.46, p.y + 2, p.w * 0.08, 5);
  }

  _drawEnemy(ctx, e) {
    const step = Math.floor(this.animTimer * 3) % 2; // 다리 흔들림 2프레임
    const x = e.x;
    const y = e.y;
    const w = e.w;
    const h = e.h;
    ctx.fillStyle = e.color;

    if (e.kind === 'squid') {
      // 오징어형: 위가 뾰족한 마름모 + 촉수
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y);
      ctx.lineTo(x + w, y + h * 0.55);
      ctx.lineTo(x + w * 0.75, y + h * 0.8);
      ctx.lineTo(x + w * 0.25, y + h * 0.8);
      ctx.lineTo(x, y + h * 0.55);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(x + w * 0.12, y + h * 0.8, w * 0.18, h * (step ? 0.2 : 0.12));
      ctx.fillRect(x + w * 0.7, y + h * 0.8, w * 0.18, h * (step ? 0.12 : 0.2));
    } else if (e.kind === 'crab') {
      // 게형: 네모 몸통 + 양쪽 집게
      ctx.fillRect(x + w * 0.18, y + h * 0.15, w * 0.64, h * 0.6);
      ctx.fillRect(x, y + h * 0.3, w * 0.16, h * 0.3);
      ctx.fillRect(x + w * 0.84, y + h * 0.3, w * 0.16, h * 0.3);
      ctx.fillRect(x + w * 0.24, y + h * 0.75, w * 0.14, h * (step ? 0.25 : 0.14));
      ctx.fillRect(x + w * 0.62, y + h * 0.75, w * 0.14, h * (step ? 0.14 : 0.25));
    } else {
      // 접시형: 납작한 타원 + 조종석
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h * 0.6, w * 0.5, h * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h * 0.34, w * 0.24, h * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x + w * (step ? 0.16 : 0.72), y + h * 0.82, w * 0.12, h * 0.16);
    }

    // 눈: 어두운 점 두 개 (모양 인식을 돕는 보조 표시)
    ctx.fillStyle = BG;
    ctx.fillRect(x + w * 0.3, y + h * 0.42, 3, 3);
    ctx.fillRect(x + w * 0.6, y + h * 0.42, 3, 3);
  }

  _drawBarriers(ctx) {
    for (const blocks of this.barriers) {
      for (const b of blocks) {
        // 내구도에 따라 색 + 크기를 함께 바꿔 색약 학생도 구분 가능
        if (b.hp >= 2) {
          ctx.fillStyle = '#9aa6ff';
          ctx.fillRect(b.x, b.y, b.w - 1, b.h - 1);
        } else {
          ctx.fillStyle = '#5a63b8';
          ctx.fillRect(b.x + 2, b.y + 2, b.w - 5, b.h - 5);
        }
      }
    }
  }

  _overlay(ctx, alpha) {
    ctx.fillStyle = 'rgba(5,5,12,' + alpha + ')';
    ctx.fillRect(0, 0, W, H);
  }

  _drawBanner(ctx) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 44px system-ui, "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#ffe14d';
    ctx.fillText(this.bannerText, W / 2, H / 2 - 40);
    ctx.font = 'bold 22px system-ui, "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('스페이스바로 발사!', W / 2, H / 2);
  }

  _drawPaused(ctx) {
    this._overlay(ctx, 0.6);
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px system-ui, "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('일시정지', W / 2, H / 2 - 10);
    ctx.font = 'bold 24px system-ui, "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#ffe14d';
    ctx.fillText('P키를 다시 누르면 계속합니다', W / 2, H / 2 + 40);
  }

  _drawGameOver(ctx) {
    this._overlay(ctx, 0.72);
    ctx.textAlign = 'center';
    ctx.font = 'bold 56px system-ui, "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#ff7a7a';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 46);
    ctx.font = 'bold 32px system-ui, "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('점수 ' + String(this.score).padStart(3, '0'), W / 2, H / 2 + 6);
    ctx.font = 'bold 24px system-ui, "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#ffe14d';
    ctx.fillText('R키를 눌러 다시 시작', W / 2, H / 2 + 52);
  }
}

return Shooter;
})();

/* ===== games/breakout.js (인라인) ===== */
const Breakout = (() => {
// 벽돌깨기(Breakout) — 교실용 레트로 아케이드 게임
// 공통 인터페이스 계약 v1 준수: default export 클래스 1개, constructor/start/stop
// 외부 라이브러리·CDN·이미지·소리 없음. 순수 Canvas 2D.

const W = 800;            // 논리 가로 해상도(고정)
const H = 600;            // 논리 세로 해상도(고정)
const BG = '#0b0b12';     // 배경색(계약값)

// 시스템 폰트 스택(웹폰트 금지)
const FONT = 'system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif';

// ---- 플레이 영역 ----
const HUD_H = 64;         // 상단 HUD 높이
const WALL = 12;          // 좌우/상단 벽 두께
const FIELD_TOP = HUD_H + WALL;

// ---- 패들 ----
const PADDLE_W = 130;     // 초보 배려: 넉넉한 폭
const PADDLE_H = 16;
const PADDLE_Y = H - 46;
const PADDLE_SPEED = 620; // px/초

// ---- 공 ----
const BALL_R = 9;
const SPEED_BASE = 235;    // 1스테이지 시작 속도(느긋하게)
const SPEED_STEP = 22;     // 스테이지당 상승폭
const SPEED_MAX = 430;     // 속도 상한(무한 가속 방지)
const MIN_VY_RATIO = 0.30; // 수평 갇힘 방지: 세로 속도 최소 비율
const MIN_VX_RATIO = 0.12; // 완전 수직 반복 방지: 가로 속도 최소 비율

// ---- 벽돌 ----
const ROWS = 7;
const COLS = 11;
const BRICK_GAP = 6;
const BRICK_MARGIN_X = 24;
const BRICK_TOP = FIELD_TOP + 24;
const BRICK_H = 26;
const BRICK_W = (W - BRICK_MARGIN_X * 2 - BRICK_GAP * (COLS - 1)) / COLS;
// 윗줄일수록 단단하고 점수가 높다
const ROW_HP = [3, 3, 2, 2, 1, 1, 1];
// 내구도별 색(숫자·무늬와 함께 쓰므로 색만으로 구분하지 않음)
const HP_COLOR = { 3: '#e8503f', 2: '#f0a52a', 1: '#4db9e8' };
const HP_EDGE = { 3: '#ffb3a8', 2: '#ffdca0', 1: '#bfe9ff' };

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

class Breakout {
  constructor(canvas) {
    this.canvas = canvas;
    canvas.width = W;
    canvas.height = H;
    this.ctx = canvas.getContext('2d');

    // 콜백 훅(셸이 주입, 없으면 무시)
    this.onScore = null;
    this.onGameOver = null;

    // 리스너는 반드시 고정 참조로 보관(익명 함수 금지)
    this._onKeyDown = this._onKeyDown.bind(this);
    this._onKeyUp = this._onKeyUp.bind(this);
    this._loop = this._loop.bind(this);

    this._rafId = 0;
    this._running = false;
    this._listening = false;
    this._lastTs = 0;

    this.keys = { left: false, right: false };
    this._resetGame();
  }

  // ===== 생명주기 =====

  start() {
    if (this._running) return; // 중복 호출 안전
    this._running = true;
    if (!this._listening) {
      window.addEventListener('keydown', this._onKeyDown);
      window.addEventListener('keyup', this._onKeyUp);
      this._listening = true;
    }
    // stop() 뒤 재호출이면 새 판으로 시작
    if (this.state === 'over' || this._needFresh) this._resetGame();
    this._needFresh = false;
    this._lastTs = 0;
    this._rafId = requestAnimationFrame(this._loop);
  }

  stop() {
    if (!this._running && !this._listening) return; // 중복 호출 안전
    this._running = false;
    if (this._rafId) {
      cancelAnimationFrame(this._rafId);
      this._rafId = 0;
    }
    if (this._listening) {
      window.removeEventListener('keydown', this._onKeyDown);
      window.removeEventListener('keyup', this._onKeyUp);
      this._listening = false;
    }
    this.keys.left = false;
    this.keys.right = false;
    this._needFresh = true; // 다음 start()는 새 판
  }

  // ===== 상태 초기화 =====

  _resetGame() {
    this.score = 0;
    this.lives = 3;
    this.stage = 1;
    this.state = 'ready';   // ready | playing | paused | stageclear | over
    this.stageTimer = 0;
    this.flash = 0;         // 목숨 감소 시 화면 표시용 타이머
    this._needFresh = false;
    this.paddle = { x: (W - PADDLE_W) / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
    this._buildStage();
    this._resetBall();
    this._emitScore();
  }

  // 벽돌 재배치
  _buildStage() {
    this.bricks = [];
    for (let r = 0; r < ROWS; r++) {
      const hp = ROW_HP[r % ROW_HP.length];
      for (let c = 0; c < COLS; c++) {
        this.bricks.push({
          x: BRICK_MARGIN_X + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          hp,
          maxHp: hp,
          alive: true,
        });
      }
    }
    this.remaining = this.bricks.length;
  }

  // 공을 패들 위에 붙인다
  _resetBall() {
    this.speed = Math.min(SPEED_BASE + (this.stage - 1) * SPEED_STEP, SPEED_MAX);
    this.ball = {
      x: this.paddle.x + this.paddle.w / 2,
      y: this.paddle.y - BALL_R - 1,
      vx: 0,
      vy: 0,
      stuck: true,
    };
  }

  // 스페이스바 발사: 살짝 비스듬히 위로
  _launch() {
    if (!this.ball.stuck) return;
    const angle = (-Math.PI / 2) + (Math.random() * 0.5 - 0.25); // 위쪽 ±14도
    this.ball.vx = Math.cos(angle) * this.speed;
    this.ball.vy = Math.sin(angle) * this.speed;
    this.ball.stuck = false;
    this.state = 'playing';
    this._enforceAngle();
  }

  _emitScore() {
    if (typeof this.onScore === 'function') this.onScore(this.score);
  }

  _addScore(n) {
    this.score += n;
    this._emitScore();
  }

  // ===== 입력 =====

  _onKeyDown(e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ' || k === 'Spacebar') {
      e.preventDefault(); // 화살표·스페이스 스크롤 방지
    }
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') this.keys.left = true;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') this.keys.right = true;

    if (k === ' ' || k === 'Spacebar') {
      if (this.state === 'ready' || this.state === 'playing') this._launch();
    }
    if (k === 'p' || k === 'P') {
      if (this.state === 'playing' || this.state === 'ready') this.state = 'paused';
      else if (this.state === 'paused') this.state = this.ball.stuck ? 'ready' : 'playing';
    }
    if (k === 'r' || k === 'R') {
      this._resetGame();
    }
  }

  _onKeyUp(e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') this.keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') this.keys.right = false;
  }

  // ===== 루프 =====

  _loop(ts) {
    if (!this._running) return;
    if (!this._lastTs) this._lastTs = ts;
    // 탭 전환 등으로 dt가 크게 튀는 것을 막는다
    const dt = clamp((ts - this._lastTs) / 1000, 0, 0.05);
    this._lastTs = ts;

    this._update(dt);
    this._draw();

    this._rafId = requestAnimationFrame(this._loop);
  }

  _update(dt) {
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt);
    if (this.state === 'paused' || this.state === 'over') return;

    this._movePaddle(dt);

    if (this.state === 'stageclear') {
      this.stageTimer -= dt;
      if (this.stageTimer <= 0) {
        this.stage += 1;
        this._buildStage();
        this._resetBall();
        this.state = 'ready';
      }
      return;
    }

    if (this.ball.stuck) {
      // 발사 전엔 패들에 붙어 따라다닌다
      this.ball.x = this.paddle.x + this.paddle.w / 2;
      this.ball.y = this.paddle.y - BALL_R - 1;
      return;
    }

    this._moveBall(dt);
  }

  _movePaddle(dt) {
    const p = this.paddle;
    if (this.keys.left) p.x -= PADDLE_SPEED * dt;
    if (this.keys.right) p.x += PADDLE_SPEED * dt;
    p.x = clamp(p.x, WALL, W - WALL - p.w); // 화면 밖 금지
  }

  // 빠른 공이 벽돌을 통과하지 않도록 잘게 나눠 이동
  _moveBall(dt) {
    const b = this.ball;
    const dist = Math.hypot(b.vx, b.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.8)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;
      this._collideWalls();
      if (this.state !== 'playing') return; // 목숨 감소 시 중단
      this._collideBricks();
      this._collidePaddle();
      if (this.state !== 'playing') return; // 스테이지 클리어 시 중단
    }
  }

  _collideWalls() {
    const b = this.ball;
    if (b.x - BALL_R < WALL) { b.x = WALL + BALL_R; b.vx = Math.abs(b.vx); this._enforceAngle(); }
    if (b.x + BALL_R > W - WALL) { b.x = W - WALL - BALL_R; b.vx = -Math.abs(b.vx); this._enforceAngle(); }
    if (b.y - BALL_R < FIELD_TOP) { b.y = FIELD_TOP + BALL_R; b.vy = Math.abs(b.vy); this._enforceAngle(); }
    if (b.y - BALL_R > H) this._loseLife(); // 바닥으로 놓침
  }

  _collidePaddle() {
    const b = this.ball;
    const p = this.paddle;
    if (b.vy <= 0) return; // 내려올 때만 판정
    if (b.y + BALL_R < p.y || b.y - BALL_R > p.y + p.h) return;
    if (b.x + BALL_R < p.x || b.x - BALL_R > p.x + p.w) return;

    // 패들의 어느 지점에 맞았는지로 반사각 결정
    // 가운데(0) = 수직, 가장자리(±1) = 최대 ±62도
    const hit = clamp((b.x - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
    const maxAngle = (62 * Math.PI) / 180;
    const angle = hit * maxAngle;
    const sp = Math.min(Math.hypot(b.vx, b.vy), SPEED_MAX);
    b.vx = Math.sin(angle) * sp;
    b.vy = -Math.cos(angle) * sp;
    b.y = p.y - BALL_R - 0.5;
    this._enforceAngle();
  }

  _collideBricks() {
    const b = this.ball;
    for (let i = 0; i < this.bricks.length; i++) {
      const k = this.bricks[i];
      if (!k.alive) continue;
      if (b.x + BALL_R < k.x || b.x - BALL_R > k.x + k.w) continue;
      if (b.y + BALL_R < k.y || b.y - BALL_R > k.y + k.h) continue;

      // 겹침이 작은 축으로 되튄다
      const overlapX = Math.min(b.x + BALL_R - k.x, k.x + k.w - (b.x - BALL_R));
      const overlapY = Math.min(b.y + BALL_R - k.y, k.y + k.h - (b.y - BALL_R));
      if (overlapX < overlapY) {
        b.vx = -b.vx;
        b.x += b.vx > 0 ? overlapX : -overlapX;
      } else {
        b.vy = -b.vy;
        b.y += b.vy > 0 ? overlapY : -overlapY;
      }
      this._enforceAngle();

      k.hp -= 1;
      if (k.hp <= 0) {
        k.alive = false;
        this.remaining -= 1;
        this._addScore(k.maxHp * 20);
      } else {
        this._addScore(5); // 단단한 벽돌은 때릴 때마다 소량 점수
      }

      if (this.remaining <= 0) {
        this.state = 'stageclear';
        this.stageTimer = 1.6;
      }
      return; // 한 스텝에 벽돌 하나만 처리
    }
  }

  // 각도 하한: 수평·수직 무한 반사 방지 + 속도 상한 유지
  _enforceAngle() {
    const b = this.ball;
    let sp = Math.hypot(b.vx, b.vy);
    if (sp === 0) return;
    if (sp > SPEED_MAX) sp = SPEED_MAX;

    let vx = b.vx;
    let vy = b.vy;
    const minVy = sp * MIN_VY_RATIO;
    const minVx = sp * MIN_VX_RATIO;

    if (Math.abs(vy) < minVy) {
      vy = (vy < 0 ? -1 : 1) * minVy;
      const rest = Math.max(0, sp * sp - vy * vy);
      vx = (vx < 0 ? -1 : 1) * Math.sqrt(rest);
    }
    if (Math.abs(vx) < minVx) {
      const sign = vx === 0 ? (Math.random() < 0.5 ? -1 : 1) : (vx < 0 ? -1 : 1);
      vx = sign * minVx;
      const rest = Math.max(0, sp * sp - vx * vx);
      vy = (vy < 0 ? -1 : 1) * Math.sqrt(rest);
    }
    // 최종 정규화(속도 상한 고정)
    const cur = Math.hypot(vx, vy) || 1;
    b.vx = (vx / cur) * sp;
    b.vy = (vy / cur) * sp;
  }

  _loseLife() {
    this.lives -= 1;
    this.flash = 0.6;
    if (this.lives <= 0) {
      this.lives = 0;
      this.state = 'over';
      if (typeof this.onGameOver === 'function') this.onGameOver(this.score);
      return;
    }
    this._resetBall();
    this.state = 'ready';
  }

  // ===== 그리기 =====

  _draw() {
    const ctx = this.ctx;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H); // 매 프레임 배경 클리어(잔상 방지)

    this._drawField();
    this._drawBricks();
    this._drawPaddle();
    this._drawBall();
    this._drawHUD();
    this._drawOverlay();
  }

  _drawField() {
    const ctx = this.ctx;
    ctx.fillStyle = '#1d2033';
    ctx.fillRect(0, FIELD_TOP - WALL, W, WALL);                            // 상단 벽
    ctx.fillRect(0, FIELD_TOP - WALL, WALL, H - FIELD_TOP + WALL);         // 좌측 벽
    ctx.fillRect(W - WALL, FIELD_TOP - WALL, WALL, H - FIELD_TOP + WALL);  // 우측 벽
  }

  _drawBricks() {
    const ctx = this.ctx;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const k of this.bricks) {
      if (!k.alive) continue;
      const hp = k.hp;
      ctx.fillStyle = HP_COLOR[hp] || '#8899aa';
      ctx.fillRect(k.x, k.y, k.w, k.h);

      // 무늬로도 내구도 구분(색약 배려): 3=대각선, 2=점, 1=없음
      ctx.save();
      ctx.beginPath();
      ctx.rect(k.x, k.y, k.w, k.h);
      ctx.clip();
      if (hp >= 3) {
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 3;
        for (let d = -k.h; d < k.w; d += 9) {
          ctx.beginPath();
          ctx.moveTo(k.x + d, k.y + k.h);
          ctx.lineTo(k.x + d + k.h, k.y);
          ctx.stroke();
        }
      } else if (hp === 2) {
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        for (let px = 8; px < k.w; px += 12) {
          ctx.beginPath();
          ctx.arc(k.x + px, k.y + k.h / 2, 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      // 테두리
      ctx.strokeStyle = HP_EDGE[hp] || '#ffffff';
      ctx.lineWidth = hp >= 3 ? 3 : 2;
      ctx.strokeRect(k.x + 1, k.y + 1, k.w - 2, k.h - 2);

      // 남은 내구도 숫자
      ctx.fillStyle = '#0b0b12';
      ctx.font = '700 20px ' + FONT;
      ctx.fillText(String(hp), k.x + k.w / 2, k.y + k.h / 2 + 1);
    }
  }

  _drawPaddle() {
    const ctx = this.ctx;
    const p = this.paddle;
    ctx.fillStyle = '#e9eefc';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    // 가운데 표시(반사각 기준점을 학생이 알 수 있게)
    ctx.fillStyle = '#5b6bff';
    ctx.fillRect(p.x + p.w / 2 - 3, p.y, 6, p.h);
  }

  _drawBall() {
    const ctx = this.ctx;
    const b = this.ball;
    ctx.fillStyle = '#fff45a';
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0b0b12';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  _drawHUD() {
    const ctx = this.ctx;
    ctx.fillStyle = '#141626';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.font = '700 24px ' + FONT;
    ctx.textBaseline = 'middle';

    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('점수 ' + String(this.score).padStart(4, '0'), 16, HUD_H / 2);

    ctx.fillStyle = '#ffd166';
    const hearts = this.lives > 0 ? '♥'.repeat(this.lives) : '없음';
    ctx.fillText('목숨 ' + hearts, 200, HUD_H / 2);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#8fe1ff';
    ctx.fillText('스테이지 ' + this.stage, W / 2 + 80, HUD_H / 2);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#c9d3ff';
    ctx.fillText('남은 벽돌 ' + this.remaining, W - 16, HUD_H / 2);
  }

  // 반투명 안내판
  _panel(y, h) {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(8,8,18,0.85)';
    ctx.fillRect(60, y, W - 120, h);
    ctx.strokeStyle = '#5b6bff';
    ctx.lineWidth = 3;
    ctx.strokeRect(60, y, W - 120, h);
  }

  _drawOverlay() {
    const ctx = this.ctx;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (this.state === 'ready') {
      this._panel(H / 2 - 60, 120);
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 34px ' + FONT;
      ctx.fillText('스페이스바를 눌러 시작', W / 2, H / 2 - 18);
      ctx.font = '600 21px ' + FONT;
      ctx.fillStyle = '#c9d3ff';
      ctx.fillText('← → (또는 A/D) 이동   ·   P 일시정지   ·   R 다시 시작', W / 2, H / 2 + 26);
      return;
    }

    if (this.state === 'paused') {
      this._panel(H / 2 - 55, 110);
      ctx.fillStyle = '#ffd166';
      ctx.font = '700 40px ' + FONT;
      ctx.fillText('일시정지', W / 2, H / 2 - 12);
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 22px ' + FONT;
      ctx.fillText('P키를 다시 누르면 계속합니다', W / 2, H / 2 + 28);
      return;
    }

    if (this.state === 'stageclear') {
      this._panel(H / 2 - 60, 120);
      ctx.fillStyle = '#7dffb0';
      ctx.font = '700 38px ' + FONT;
      ctx.fillText('스테이지 ' + this.stage + ' 클리어!', W / 2, H / 2 - 16);
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 22px ' + FONT;
      ctx.fillText('다음 스테이지 준비 중… 공이 조금 빨라집니다', W / 2, H / 2 + 26);
      return;
    }

    if (this.state === 'over') {
      this._panel(H / 2 - 80, 160);
      ctx.fillStyle = '#ff6b6b';
      ctx.font = '700 52px ' + FONT;
      ctx.fillText('GAME OVER', W / 2, H / 2 - 34);
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 30px ' + FONT;
      ctx.fillText('점수 ' + String(this.score).padStart(3, '0'), W / 2, H / 2 + 12);
      ctx.font = '600 24px ' + FONT;
      ctx.fillStyle = '#c9d3ff';
      ctx.fillText('R키를 눌러 다시 시작', W / 2, H / 2 + 52);
      return;
    }

    // 목숨을 잃은 직후 짧게 붉은 표시
    if (this.flash > 0) {
      ctx.fillStyle = 'rgba(255,80,80,' + (0.35 * this.flash).toFixed(3) + ')';
      ctx.fillRect(0, FIELD_TOP, W, H - FIELD_TOP);
    }
  }
}

return Breakout;
})();

/* ===== games/snake.js (인라인) ===== */
const Snake = (() => {
/**
 * 클래식 스네이크(지렁이) 게임
 * 공통 게임 인터페이스 계약 v1 준수 (games/INTERFACE.md)
 *
 * - 논리 해상도 800 x 600 고정
 * - 격자: 25px x 25px → 32칸 x 24칸 (800 = 25*32, 600 = 25*24)
 * - HUD는 상단 반투명 오버레이로 처리(격자를 가리지 않아 위치 파악이 쉬움)
 * - 외부 라이브러리 / CDN / 폰트 / 이미지 / 소리 전부 사용하지 않음
 */

// ── 상수 ─────────────────────────────────────────────
const CELL = 25;            // 한 칸 크기(px)
const COLS = 32;            // 가로 칸 수 (25 * 32 = 800)
const ROWS = 24;            // 세로 칸 수 (25 * 24 = 600)
const W = CELL * COLS;      // 800
const H = CELL * ROWS;      // 600

const TICK_START = 150;     // 시작 이동 간격(ms) — 느긋하게
const TICK_MIN = 70;        // 최소 이동 간격(ms) — 너무 빨라지지 않게
const TICK_STEP = 3;        // 먹이 하나당 빨라지는 정도(ms)
const SCORE_PER_FOOD = 10;  // 먹이 하나당 점수

const BEST_KEY = 'retro-arcade-snake-best';
const FONT = '"Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif';

// 색상 (색만으로 구분하지 않도록 모양·테두리도 함께 사용)
const C_BG = '#0b0b12';
const C_GRID = 'rgba(255,255,255,0.06)';
const C_WALL = '#3a3a5c';
const C_BODY = '#2fbf71';
const C_BODY_EDGE = '#0e5c37';
const C_HEAD = '#9dff6b';
const C_HEAD_EDGE = '#0b3d22';
const C_FOOD = '#ff6b6b';
const C_FOOD_EDGE = '#ffe08a';
const C_TEXT = '#ffffff';
const C_SUB = '#c9c9e0';

/** 최고 점수 읽기 (학교 PC에서 차단돼 있어도 게임이 죽지 않게) */
function loadBest() {
  try {
    const v = window.localStorage.getItem(BEST_KEY);
    const n = parseInt(v, 10);
    return Number.isFinite(n) && n > 0 ? n : 0;
  } catch (e) {
    return 0;
  }
}

/** 최고 점수 저장 */
function saveBest(score) {
  try {
    window.localStorage.setItem(BEST_KEY, String(score));
  } catch (e) {
    /* 차단된 환경이면 조용히 무시 */
  }
}

class Snake {
  constructor(canvas) {
    this.canvas = canvas;
    this.canvas.width = W;
    this.canvas.height = H;
    this.ctx = canvas.getContext('2d');

    // 루프/리스너 관련 필드 (여기서 시작하지 않음)
    this._rafId = 0;
    this._running = false;
    this._lastTime = 0;
    this._acc = 0;

    // 리스너는 바인딩된 참조를 필드에 보관해서 stop()에서 정확히 제거
    this._onKeyDown = this._onKeyDown.bind(this);
    this._frame = this._frame.bind(this);

    // 선택 콜백
    this.onScore = null;
    this.onGameOver = null;

    this.best = 0;
    this.score = 0;
    this._reset();
  }

  // ── 상태 초기화 ────────────────────────────────────
  /** 새 판 준비 */
  _reset() {
    // 뱀: 가운데에서 오른쪽을 보고 3칸으로 시작
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    this.snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy }
    ];
    this.dir = { x: 1, y: 0 };   // 현재 진행 방향
    this.queue = [];             // 입력 큐(한 틱에 여러 번 눌러도 안 꼬이게)

    this.score = 0;
    this.tickMs = TICK_START;
    this.paused = false;
    this.gameOver = false;
    this.started = false;        // 첫 방향키 입력 전에는 대기(안내 문구 표시)
    this._acc = 0;
    this._blink = 0;

    this.best = loadBest();
    this._placeFood();
  }

  /** 뱀 몸과 겹치지 않는 빈 칸에만 먹이 생성 */
  _placeFood() {
    const occupied = new Set(this.snake.map(s => s.y * COLS + s.x));
    const empty = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const k = y * COLS + x;
        if (!occupied.has(k)) empty.push(k);
      }
    }
    if (empty.length === 0) { this.food = null; return; } // 화면을 꽉 채운 경우
    const k = empty[Math.floor(Math.random() * empty.length)];
    this.food = { x: k % COLS, y: Math.floor(k / COLS) };
  }

  // ── 생명주기 ──────────────────────────────────────
  /** 루프 시작 + 키 리스너 등록. 중복 호출 안전 */
  start() {
    if (this._running) return;
    this._running = true;
    this._reset();
    window.addEventListener('keydown', this._onKeyDown);
    this._lastTime = 0;
    this._rafId = window.requestAnimationFrame(this._frame);
  }

  /** 루프 정지 + 리스너 해제. 중복 호출 안전 */
  stop() {
    if (this._rafId) {
      window.cancelAnimationFrame(this._rafId);
      this._rafId = 0;
    }
    if (this._running) {
      window.removeEventListener('keydown', this._onKeyDown);
    }
    this._running = false;
  }

  // ── 입력 ──────────────────────────────────────────
  _onKeyDown(e) {
    const k = e.key;
    const code = e.code;

    // 방향키·스페이스로 화면이 스크롤되지 않게 막는다
    if (
      code === 'ArrowUp' || code === 'ArrowDown' ||
      code === 'ArrowLeft' || code === 'ArrowRight' || code === 'Space'
    ) {
      e.preventDefault();
    }

    // R: 재시작
    if (k === 'r' || k === 'R' || code === 'KeyR') {
      this._reset();
      return;
    }

    // P: 일시정지 (게임 오버 상태에서는 무시)
    if (k === 'p' || k === 'P' || code === 'KeyP') {
      if (!this.gameOver) this.paused = !this.paused;
      return;
    }

    if (this.gameOver) return;

    let nd = null;
    if (code === 'ArrowUp' || code === 'KeyW') nd = { x: 0, y: -1 };
    else if (code === 'ArrowDown' || code === 'KeyS') nd = { x: 0, y: 1 };
    else if (code === 'ArrowLeft' || code === 'KeyA') nd = { x: -1, y: 0 };
    else if (code === 'ArrowRight' || code === 'KeyD') nd = { x: 1, y: 0 };
    if (!nd) return;

    // 일시정지 중 방향키를 누르면 자연스럽게 재개
    if (this.paused) this.paused = false;

    // 아직 시작 전이면 첫 입력으로 출발
    if (!this.started) { this.started = true; this._acc = 0; }

    this._pushDir(nd);
  }

  /**
   * 입력 큐에 방향을 넣는다.
   * 큐의 마지막 방향(없으면 현재 방향)을 기준으로
   * 정반대·중복 방향은 버려서 자기 목에 박는 즉사를 막는다.
   */
  _pushDir(nd) {
    const last = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
    if (nd.x === -last.x && nd.y === -last.y) return; // 정반대 금지
    if (nd.x === last.x && nd.y === last.y) return;   // 같은 방향 중복 금지
    if (this.queue.length >= 3) return;               // 큐 과다 방지
    this.queue.push(nd);
  }

  // ── 루프 ──────────────────────────────────────────
  _frame(now) {
    if (!this._running) return;
    if (!this._lastTime) this._lastTime = now;
    let dt = now - this._lastTime;
    this._lastTime = now;
    if (dt > 250) dt = 250; // 탭 전환 등으로 멈췄다 돌아온 경우 보정

    this._blink += dt;

    if (this.started && !this.paused && !this.gameOver) {
      // 고정 틱 간격(누적 시간 방식)으로 이동
      this._acc += dt;
      let guard = 0;
      while (this._acc >= this.tickMs && !this.gameOver && guard < 5) {
        this._acc -= this.tickMs;
        this._step();
        guard++;
      }
    }

    this._draw();
    this._rafId = window.requestAnimationFrame(this._frame);
  }

  /** 한 칸 이동 */
  _step() {
    // 큐에서 방향 하나 꺼내기
    if (this.queue.length) {
      const nd = this.queue.shift();
      if (!(nd.x === -this.dir.x && nd.y === -this.dir.y)) this.dir = nd;
    }

    const head = this.snake[0];
    const nx = head.x + this.dir.x;
    const ny = head.y + this.dir.y;

    // 벽 충돌
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { this._die(); return; }

    // 자기 몸 충돌 (꼬리 끝은 이번 틱에 비워지므로 제외)
    const willGrow = !!this.food && nx === this.food.x && ny === this.food.y;
    const limit = willGrow ? this.snake.length : this.snake.length - 1;
    for (let i = 0; i < limit; i++) {
      if (this.snake[i].x === nx && this.snake[i].y === ny) { this._die(); return; }
    }

    this.snake.unshift({ x: nx, y: ny });

    if (willGrow) {
      // 먹이 획득: 꼬리를 자르지 않아 몸이 1칸 늘어남 + 점수 + 아주 조금 빨라짐
      this.score += SCORE_PER_FOOD;
      this.tickMs = Math.max(TICK_MIN, this.tickMs - TICK_STEP);
      if (this.score > this.best) { this.best = this.score; saveBest(this.best); }
      this.onScore?.(this.score);
      this._placeFood();
    } else {
      this.snake.pop();
    }
  }

  /** 게임 오버 처리 */
  _die() {
    this.gameOver = true;
    if (this.score > this.best) { this.best = this.score; saveBest(this.best); }
    this.onGameOver?.(this.score);
  }

  // ── 그리기 ────────────────────────────────────────
  _draw() {
    const ctx = this.ctx;

    // 배경 (잔상 방지: 매 프레임 전체 칠하기)
    ctx.fillStyle = C_BG;
    ctx.fillRect(0, 0, W, H);

    this._drawGrid();
    this._drawFood();
    this._drawSnake();
    this._drawWalls();
    this._drawHud();

    if (!this.started && !this.gameOver) this._drawReady();
    else if (this.paused && !this.gameOver) this._drawPaused();
    else if (this.gameOver) this._drawGameOver();
  }

  /** 은은한 격자 선 — 위치 파악을 쉽게 */
  _drawGrid() {
    const ctx = this.ctx;
    ctx.strokeStyle = C_GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) {
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, H);
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(W, y * CELL + 0.5);
    }
    ctx.stroke();
  }

  /** 바깥 벽 테두리 */
  _drawWalls() {
    const ctx = this.ctx;
    ctx.strokeStyle = C_WALL;
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, W - 4, H - 4);
  }

  /** 먹이: 빨간 원 + 밝은 테두리 (모양으로도 구분) */
  _drawFood() {
    if (!this.food) return;
    const ctx = this.ctx;
    const cx = this.food.x * CELL + CELL / 2;
    const cy = this.food.y * CELL + CELL / 2;
    // 아주 약한 크기 변화로 눈에 띄게(과한 애니메이션은 피함)
    const r = CELL * 0.34 + Math.sin(this._blink / 400) * 1.2;

    ctx.fillStyle = C_FOOD;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = C_FOOD_EDGE;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  /** 뱀: 몸은 사각형+테두리, 머리는 밝은 색 + 눈(진행 방향 표시) */
  _drawSnake() {
    const ctx = this.ctx;

    // 몸통 (뒤에서부터 그려 머리가 위로 오게)
    for (let i = this.snake.length - 1; i >= 1; i--) {
      const s = this.snake[i];
      const px = s.x * CELL;
      const py = s.y * CELL;
      ctx.fillStyle = C_BODY;
      ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
      ctx.strokeStyle = C_BODY_EDGE;
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 3, py + 3, CELL - 6, CELL - 6);
    }

    // 머리
    const h = this.snake[0];
    const hx = h.x * CELL;
    const hy = h.y * CELL;
    ctx.fillStyle = C_HEAD;
    ctx.fillRect(hx + 1, hy + 1, CELL - 2, CELL - 2);
    ctx.strokeStyle = C_HEAD_EDGE;
    ctx.lineWidth = 3;
    ctx.strokeRect(hx + 2.5, hy + 2.5, CELL - 5, CELL - 5);

    // 눈 두 개 — 진행 방향 쪽으로 치우치게 그려서 방향이 보이게
    const cx = hx + CELL / 2;
    const cy = hy + CELL / 2;
    const d = this.dir;
    const fx = d.x * CELL * 0.22;   // 앞쪽 이동량
    const fy = d.y * CELL * 0.22;
    const sx = -d.y * CELL * 0.20;  // 진행 방향의 수직으로 좌우 벌리기
    const sy = d.x * CELL * 0.20;

    ctx.fillStyle = C_HEAD_EDGE;
    for (const sign of [1, -1]) {
      ctx.beginPath();
      ctx.arc(cx + fx + sx * sign, cy + fy + sy * sign, 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /** 상단 HUD(반투명 오버레이) */
  _drawHud() {
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = 'rgba(11,11,18,0.72)';
    ctx.fillRect(0, 0, W, 44);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 44.5);
    ctx.lineTo(W, 44.5);
    ctx.stroke();

    ctx.textBaseline = 'middle';
    ctx.font = 'bold 24px ' + FONT;
    ctx.fillStyle = C_TEXT;
    ctx.textAlign = 'left';
    ctx.fillText('점수 ' + this.score, 16, 23);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd76b';
    ctx.fillText('최고 ' + this.best, W - 16, 23);

    ctx.textAlign = 'center';
    ctx.font = 'bold 20px ' + FONT;
    ctx.fillStyle = C_SUB;
    ctx.fillText('P 일시정지 · R 재시작', W / 2, 23);
    ctx.restore();
  }

  /** 가운데 안내 상자 */
  _drawPanel(lines, boxH) {
    const ctx = this.ctx;
    const bw = 580;
    const bx = (W - bw) / 2;
    const by = (H - boxH) / 2;
    ctx.save();
    ctx.fillStyle = 'rgba(8,8,16,0.90)';
    ctx.fillRect(bx, by, bw, boxH);
    ctx.strokeStyle = '#7de1a8';
    ctx.lineWidth = 3;
    ctx.strokeRect(bx + 1.5, by + 1.5, bw - 3, boxH - 3);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let y = by + 46;
    for (const ln of lines) {
      ctx.font = 'bold ' + ln.size + 'px ' + FONT;
      ctx.fillStyle = ln.color;
      ctx.fillText(ln.text, W / 2, y);
      y += ln.size + 18;
    }
    ctx.restore();
  }

  /** 시작 전 안내 */
  _drawReady() {
    this._drawPanel([
      { text: '스네이크', size: 44, color: '#9dff6b' },
      { text: '방향키(또는 WASD)로 움직이세요', size: 24, color: C_TEXT },
      { text: '빨간 먹이를 먹으면 몸이 길어져요', size: 22, color: C_SUB },
      { text: '아무 방향키나 누르면 시작!', size: 24, color: '#ffd76b' }
    ], 250);
  }

  /** 일시정지 */
  _drawPaused() {
    this._drawPanel([
      { text: '일시정지', size: 44, color: '#ffd76b' },
      { text: 'P키를 다시 누르면 계속합니다', size: 24, color: C_TEXT }
    ], 160);
  }

  /** 게임 오버 */
  _drawGameOver() {
    const s = String(this.score).padStart(3, '0');
    const isBest = this.score > 0 && this.score >= this.best;
    this._drawPanel([
      { text: 'GAME OVER', size: 46, color: '#ff8b8b' },
      { text: '점수 ' + s, size: 32, color: C_TEXT },
      { text: isBest ? '최고 기록 달성!' : '최고 기록 ' + this.best, size: 22, color: '#ffd76b' },
      { text: 'R키를 눌러 다시 시작', size: 26, color: C_SUB }
    ], 290);
  }
}

return Snake;
})();

/* =========================================================
   오케스트레이터 셸
   - games/*.js 의 default export 클래스를 동적 import 해서 구동
   - 공통 계약: constructor(canvas) / start() / stop()
   - 옵셔널 훅: onScore(score), onGameOver(score)
   ========================================================= */

const GAMES = [
  { id:'shooter',  file:'./games/shooter.js',  icon:'👾', title:'우주 슈팅',
    desc:'침략해 오는 외계 함대를 막아라!',
    keys:'← → 이동 · 스페이스 발사' },
  { id:'breakout', file:'./games/breakout.js', icon:'🧱', title:'벽돌깨기',
    desc:'공을 튕겨 벽돌을 전부 부수자!',
    keys:'← → 이동 · 스페이스 발사' },
  { id:'snake',    file:'./games/snake.js',    icon:'🐍', title:'지렁이 게임',
    desc:'먹이를 먹고 길어져라. 몸에 부딪히면 끝!',
    keys:'← ↑ → ↓ 이동' },
];

const REGISTRY = { shooter: Shooter, breakout: Breakout, snake: Snake };

const $ = (id) => document.getElementById(id);
const cardsEl   = $('cards');
const menuEl    = $('menu');
const stageEl   = $('stage');
const canvas    = $('screen');
const hudEl     = $('hud');
const scoreEl   = $('score');
const helpbarEl = $('helpbar');
const errEl     = $('err');

let current = null;   // 실행 중인 게임 인스턴스
let currentId = null;

/* ---------- 메뉴 카드 생성 ---------- */
for (const g of GAMES) {
  const btn = document.createElement('button');
  btn.className = 'card';
  btn.type = 'button';
  btn.innerHTML =
    '<span class="icon" aria-hidden="true">' + g.icon + '</span>' +
    '<span class="title">' + g.title + '</span>' +
    '<span class="desc">' + g.desc + '</span>' +
    '<span class="keys">' + g.keys + '</span>';
  btn.addEventListener('click', () => launch(g));
  cardsEl.appendChild(btn);
}

/* ---------- 게임 실행 ---------- */
async function launch(g) {
  hideError();
  await shutdown();                 // 이전 게임 완전 정리 (리스너 누수 방지)

  const Klass = REGISTRY[g.id];   // 인라인 배포본: 동적 import 없이 바로 참조
  if (typeof Klass !== 'function') {
    showStage(g);
    showError('"' + g.title + '" 을(를) 불러오지 못했습니다.');
    return;
  }

  showStage(g);

  current = new Klass(canvas);
  currentId = g.id;

  // 점수 훅 연결
  scoreEl.textContent = '0';
  current.onScore    = (s) => { scoreEl.textContent = String(s ?? 0); };
  current.onGameOver = (s) => { scoreEl.textContent = String(s ?? 0); };

  current.start();
  canvas.focus();
}

function showStage(g) {
  menuEl.style.display = 'none';
  stageEl.classList.add('on');
  hudEl.hidden = false;
  helpbarEl.innerHTML =
    '<span class="key">' + g.keys.split(' · ').join('</span> <span class="key">') + '</span>' +
    '<span><span class="key">P</span> 일시정지</span>' +
    '<span><span class="key">R</span> 다시하기</span>' +
    '<span><span class="key">ESC</span> 게임 선택</span>';
}

/* ---------- 게임 정리 ---------- */
async function shutdown() {
  if (current) {
    try { current.stop(); } catch (e) { console.warn('stop() 중 오류:', e); }
    current.onScore = null;
    current.onGameOver = null;
  }
  current = null;
  currentId = null;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

async function toMenu() {
  await shutdown();
  hideError();
  stageEl.classList.remove('on');
  hudEl.hidden = true;
  menuEl.style.display = '';
  scoreEl.textContent = '0';
}

/* ---------- 셸 버튼/키 ---------- */
$('btnMenu').addEventListener('click', toMenu);
$('btnRestart').addEventListener('click', () => {
  const g = GAMES.find(x => x.id === currentId);
  if (g) launch(g);
});

// ESC = 메뉴로. (게임은 ESC 를 쓰지 않기로 계약)
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && stageEl.classList.contains('on')) { e.preventDefault(); toMenu(); }
});

// 게임 중 방향키/스페이스로 페이지가 스크롤되지 않게
window.addEventListener('keydown', (e) => {
  if (!current) return;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key)) {
    e.preventDefault();
  }
}, { passive:false });

function showError(msg){ errEl.textContent = msg; errEl.classList.add('on'); }
function hideError(){ errEl.textContent = ''; errEl.classList.remove('on'); }
</script>
</body>
</html>
